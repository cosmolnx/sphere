<!--
  LANUX — INTELLIGENCE INTERFACE
  ------------------------------------
  LANUX's MAIN VOICE CONVERSATION INTERFACE: LANUX S5 (Commander / Master
  Orchestrator) plus ten specialist neural systems — Scout, Forge,
  Architect, Artisan, Sentinel, Vector, Pilot, Memory, Watcher, Hackathon.

  Each of the 11 models has its own neural topology (buildConnections),
  node shape/rendering grammar (drawNodes), nucleus design (drawNucleus),
  and sound identity (SOUND_VOICES/playWorkingPattern) — the goal is that
  a viewer can identify the active model from its geometry and motion
  before reading the label, not just from its colour.

  Composition:
    - S5 dominant and centered, 5 specialists in a fixed left column and
      5 in a fixed right column (never a circular orbit, never above/below
      S5), with a right-hand information sidebar that can open/minimize
      (top-right toggle) and smoothly recenters the whole neural layout
      into the reclaimed space
    - a top-center "current model" header + a status pill directly under
      the giant sphere
    - a two-part sidebar: INTERNAL ACTIVITY (one message at a time, queued)
      and ACTIVE WORK + HISTORY
    - temporary neural communication streams (never permanent connecting
      lines) for S5 <-> specialist delegation and result-return, plus
      direct specialist <-> specialist "peer" messages
    - a scripted "run workflow" control that plays out an entire
      delegate -> work -> peer-communication -> complete -> acknowledge
      workflow end to end
    - the bottom-left mini brain always mirrors S5/LANUX itself (LANUX's
      persistent presence), reacting to delegation, warnings, completion,
      and voice activity regardless of which model is currently focused
    - a dark/light theme system (data-theme attribute + CSS variables,
      see THEME TOKENS below) with a persisted top-right toggle; the
      canvas sphere renderer cross-fades between PALETTE_DARK and
      PALETTE_LIGHT on the same schedule as the CSS transition

  Pure HTML + CSS + vanilla JS. No frameworks, no external assets, no
  external libraries. No microphone, no speech recognition, no TTS, no
  backend, no real model inference, no auth — every model "doing work" or
  "talking" is a visual simulation only, and all sound is procedurally
  synthesized via the Web Audio API (see AudioEngine), optional and off
  by default. This file is fully self-contained and does not touch any
  other LANUX project file.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LANUX — Intelligence Interface</title>
<script>
  // Runs synchronously, before CSS paints, so a returning visitor's saved
  // theme is already on <html> for the very first frame — no dark-then-light
  // (or light-then-dark) flash. Kept deliberately tiny and dependency-free.
  (function(){
    try {
      if (localStorage.getItem("lanuxTheme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch(e){ /* storage unavailable — falls through to the dark default */ }
  })();
</script>
<style>
  /* ==================================================================
     THEME TOKENS
     Dark (:root) is the default, unchanged LANUX identity. The light
     override below uses ONLY the hex values from
     theme/LANUX-Colour-Theme-Reference.pdf — the four locked accent
     colours (--c1..--c4) are identical in both themes; only background,
     surface, text and border values change. RGB-triplet variables
     (--*-rgb) exist purely so existing rgba(...) glass/glow effects can
     stay theme-aware without hand-converting every literal.
  ================================================================== */
  :root{
    --c1:#ABBED3;
    --c2:#B0BFD1;
    --c3:#B9C3D0;
    --c4:#CFDEEA;
    --bg:#0B0E14;      /* primary background — official LANUX foundation */
    --bg2:#0E1219;     /* secondary background */
    --surface:#131824; /* surface (panels) */
    --elevated:#1A2130;/* elevated surface (buttons, chips) */
    --hover-surface:#1A2130;

    /* semantic text roles — dark theme keeps the app's existing
       accent-driven look (label text IS an accent tone, by design) */
    --label-strong:var(--c4);
    --label-muted:var(--c3);

    /* rgb triplets for rgba() composition, dark defaults (unchanged
       from the values already hard-coded through this stylesheet) */
    --hair-rgb:207,222,234;        /* c4 — hairline borders, glows */
    --glass-rgb:26,33,48;          /* elevated — panel/button fill */
    --glass2-rgb:19,24,36;         /* surface — panel gradient stop */
    --glass3-rgb:14,18,25;         /* bg2 — panel gradient stop */
    --shadow-rgb:0,0,0;            /* panel drop shadow */
    --shadow-a:0.22;
    --warn-rgb:196,150,145;        /* warn-btn tint (muted --error) */
    --mini-glow-rgb:171,190,211;   /* mini-brain drop-shadow */
    --ambient-a-rgb:180,196,214;   /* body vignette — center highlight */
    --ambient-b-rgb:11,14,20;      /* body vignette — mid (== bg) */
    --ambient-c-rgb:6,7,11;        /* body vignette — corner darken */

    --theme-transition:.4s cubic-bezier(.4,0,.2,1);

    /* every `opacity:N` in this sheet is expressed as calc(N * --op-boost)
       so low-emphasis text keeps the same quiet weight it already has
       against the near-black dark background (boost = 1, i.e. unchanged) */
    --op-boost:1;
  }

  [data-theme="light"]{
    --bg:#F6F9FD;
    --bg2:#EEF4FB;
    --surface:#FFFFFF;
    --elevated:#FFFFFF;
    --hover-surface:#EEF4FB;

    --label-strong:#12161F;
    --label-muted:#5B6478;

    --hair-rgb:226,233,243;        /* official light --border #E2E9F3 */
    --glass-rgb:255,255,255;
    --glass2-rgb:255,255,255;
    --glass3-rgb:238,244,251;      /* official light --bg-alt #EEF4FB */
    --shadow-rgb:16,24,40;         /* neutral ink shadow, not pure black */
    --shadow-a:0.08;
    --warn-rgb:184,108,94;         /* same warm hue, darkened for contrast */
    --mini-glow-rgb:139,158,183;
    --ambient-a-rgb:176,191,209;   /* official --primary #B0BFD1 */
    --ambient-b-rgb:246,249,253;   /* == bg, so the vignette settles flat */
    --ambient-c-rgb:214,224,238;   /* soft steel edge, no black smear */

    /* same alpha blend reads far fainter on a light page than on the
       near-black default, so light theme text opacity is scaled up —
       tuned so primary copy (0.7-0.95) reaches solid readable contrast
       while the quietest caption tier stays deliberately understated */
    --op-boost:1.35;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color var(--theme-transition);
  }

  /* dark vignette (default) and light vignette cross-fade via opacity,
     rather than trying to transition a gradient's colour stops directly */
  body::before, body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:4;
    transition:opacity var(--theme-transition);
  }
  body::before{
    opacity:1;
    background:radial-gradient(ellipse at 50% 42%, rgba(180,196,214,0.05) 0%, rgba(11,14,20,0) 55%),
               radial-gradient(ellipse at 50% 50%, rgba(11,14,20,0) 0%, rgba(6,7,11,0.6) 100%);
  }
  body::after{
    opacity:0;
    background:radial-gradient(ellipse at 50% 42%, rgba(176,191,209,0.07) 0%, rgba(246,249,253,0) 55%),
               radial-gradient(ellipse at 50% 50%, rgba(246,249,253,0) 0%, rgba(214,224,238,0.4) 100%);
  }
  [data-theme="light"] body::before{ opacity:0; }
  [data-theme="light"] body::after{ opacity:1; }

  #stage{ position:fixed; inset:0; }

  canvas#main{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #overlay{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:7;
  }

  .model-hit{
    position:absolute;
    left:0; top:0;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:auto;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .model-label{
    position:relative;
    top:10px;
    text-align:center;
    color:var(--label-muted);
    opacity:calc(0.42 * var(--op-boost));
    transform:translateY(0);
    transition:opacity .35s ease, color .35s ease, transform .35s ease;
    text-shadow:0 0 10px rgba(var(--hair-rgb),0.18);
  }
  .model-name-text{
    display:block;
    font-size:10px;
    letter-spacing:0.22em;
    white-space:nowrap;
  }
  /* names sit quietly beneath every sphere at all times; hover/focus just
     brings them forward rather than toggling visibility on/off */
  .model-hit.show-label .model-label{ opacity:calc(0.94 * var(--op-boost)); color:var(--label-strong); transform:translateY(-1px); text-shadow:0 0 14px rgba(var(--hair-rgb),0.4); }
  .model-hit.is-main .model-label{ opacity:calc(0.96 * var(--op-boost)); color:var(--label-strong); }
  .model-hit.is-main .model-name-text{ font-size:12.5px; }
  /* the giant center sphere's identity is shown by the header above it and
     the status pill below it — its own under-sphere label/task would just
     collide with that status pill, so it's suppressed here */
  .model-hit.is-main .model-label,
  .model-hit.is-main .model-task{ display:none; }

  .model-purpose{
    display:block;
    font-size:7.5px;
    letter-spacing:0.09em;
    color:var(--label-muted);
    opacity:calc(0.55 * var(--op-boost));
    margin:3px auto 0;
    max-width:132px;
    line-height:1.3;
    white-space:normal;
  }

  .model-task{
    position:absolute;
    top:calc(100% + 14px);
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    letter-spacing:0.02em;
    color:var(--label-muted);
    background:rgba(var(--glass2-rgb),0.55);
    border:1px solid rgba(var(--hair-rgb),0.10);
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
    opacity:calc(0 * var(--op-boost));
    transition:opacity .3s ease;
    backdrop-filter:blur(6px);
  }
  .model-task.show{ opacity:calc(0.92 * var(--op-boost)); }
  .model-task .status{
    color:var(--label-strong);
    letter-spacing:0.14em;
    margin-right:6px;
    opacity:calc(0.8 * var(--op-boost));
  }

  /* current-model header — positioned dynamically in JS just above the
     central sphere (its bottom edge is pinned to the sphere's top edge
     with a small gap), so it always reads as "belonging" to the sphere */
  #topLabel{
    position:fixed; left:50%; top:0;
    transform:translate(-50%,-100%);
    z-index:10; user-select:none; pointer-events:none;
    text-align:center; white-space:nowrap;
  }
  #topLabel .headerName{
    display:block; color:var(--label-strong);
    font-size:13px; letter-spacing:0.24em; opacity:calc(0.92 * var(--op-boost));
    text-shadow:0 0 14px rgba(var(--hair-rgb),0.3);
  }
  #topLabel .sub{ display:block; font-size:9px; letter-spacing:0.1em; color:var(--label-muted); opacity:calc(0.6 * var(--op-boost)); margin-top:5px; }

  /* central status pill — positioned dynamically just below the sphere */
  #statusBar{
    position:fixed; left:50%; top:0;
    transform:translate(-50%,0);
    z-index:10; pointer-events:none;
    background:rgba(var(--glass-rgb),0.42);
    border:1px solid rgba(var(--hair-rgb),0.14);
    border-radius:6px;
    padding:6px 0;
    text-align:center;
    backdrop-filter:blur(8px);
    transition:background var(--theme-transition), border-color var(--theme-transition);
  }
  #statusBar span{
    font-size:9.5px; letter-spacing:0.28em; color:var(--label-strong); opacity:calc(0.85 * var(--op-boost));
  }

  /* ---------------- top-right sidebar toggle ---------------- */
  #sidebarToggle{
    position:fixed; top:22px; right:22px; z-index:12;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid rgba(var(--hair-rgb),0.16);
    background:rgba(var(--glass-rgb),0.5);
    color:var(--label-strong);
    font-size:15px; line-height:1;
    cursor:pointer;
    backdrop-filter:blur(10px);
    transition:background .25s ease, border-color .25s ease, transform .3s ease;
  }
  #sidebarToggle:hover{ background:rgba(var(--hair-rgb),0.10); border-color:rgba(var(--hair-rgb),0.4); }
  #sidebarToggle:focus-visible{ outline:2px solid var(--c1); outline-offset:3px; }
  #sidebarToggleIcon{ display:inline-block; transition:transform .35s ease; }
  #sidebarToggle.is-open #sidebarToggleIcon{ transform:rotate(180deg); }

  /* ---------------- top-right theme toggle ----------------
     A deliberately plain pill switch (no sun/moon glyphs, no browser-
     native checkbox look) — the LANUX identity comes from the thumb
     using the documented primary→primary-strong button gradient, the
     same gradient the colour reference defines for real product
     buttons, not from decoration. */
  #themeToggle{
    position:fixed; top:22px; right:66px; z-index:12;
    width:46px; height:26px; box-sizing:border-box;
    padding:3px;
    border-radius:999px;
    border:1px solid rgba(var(--hair-rgb),0.18);
    background:rgba(var(--glass-rgb),0.55);
    cursor:pointer;
    appearance:none; -webkit-appearance:none;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .3s ease, border-color .3s ease;
  }
  #themeToggle:hover{ border-color:rgba(var(--hair-rgb),0.4); }
  #themeToggle:focus-visible{ outline:2px solid var(--c1); outline-offset:3px; }
  .theme-toggle-thumb{
    display:block; width:18px; height:18px; border-radius:50%;
    background:linear-gradient(180deg, var(--c2), var(--c1));
    box-shadow:0 1px 4px rgba(var(--shadow-rgb),0.35);
    transform:translateX(0);
    transition:transform .5s cubic-bezier(.4,0,.2,1), background .5s ease;
  }
  #themeToggle[aria-checked="true"] .theme-toggle-thumb{ transform:translateX(20px); }

  /* ---------------- right information sidebar (two stacked panels) ---------------- */
  #sidebar{
    position:fixed; top:80px; right:22px; bottom:150px;
    width:min(300px, 20vw);
    display:flex; flex-direction:column; gap:16px;
    z-index:9; pointer-events:none;
    opacity:calc(1 * var(--op-boost)); transform:translateX(0);
    transition:opacity .4s ease, transform .45s cubic-bezier(.4,0,.2,1);
  }
  #sidebar.minimized{
    opacity:calc(0 * var(--op-boost));
    transform:translateX(24px);
    pointer-events:none;
  }
  .sidebar-panel{
    background:linear-gradient(180deg, rgba(var(--glass2-rgb),0.58), rgba(var(--glass3-rgb),0.38));
    border:1px solid rgba(var(--hair-rgb),0.09);
    border-radius:16px;
    padding:12px 16px 14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(var(--shadow-rgb),var(--shadow-a));
    transition:background var(--theme-transition), border-color var(--theme-transition), box-shadow var(--theme-transition);
    overflow:hidden;
  }
  #feedPanel{ min-height:80px; }
  #workHistoryPanel{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .panel-caption{
    font-size:8px; letter-spacing:0.28em; color:var(--label-muted); opacity:calc(0.42 * var(--op-boost));
    margin-bottom:8px; flex:none;
  }
  .panel-caption-sub{ margin-top:12px; opacity:calc(0.32 * var(--op-boost)); }
  #feedBody{ min-height:34px; }
  .feed-msg{ font-size:11px; line-height:1.45; opacity:calc(0 * var(--op-boost)); transition:opacity .45s ease; }
  .feed-msg.visible{ opacity:calc(1 * var(--op-boost)); }
  .feed-speaker{ display:block; color:var(--label-strong); letter-spacing:0.06em; font-weight:600; opacity:calc(0.92 * var(--op-boost)); margin-bottom:2px; }
  .feed-text{ color:var(--label-muted); opacity:calc(0.82 * var(--op-boost)); }
  #workBody{ flex:none; max-height:40%; overflow:hidden; }
  #historyBody{ flex:1; overflow:hidden; }
  @keyframes rowIn{ from{ opacity:calc(0 * var(--op-boost)); transform:translateY(4px); } to{ opacity:calc(1 * var(--op-boost)); transform:translateY(0); } }
  .work-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid rgba(var(--hair-rgb),0.06); animation:rowIn .4s ease; }
  .work-row:last-child{ border-bottom:none; }
  .work-main{ min-width:0; }
  .work-model{ font-size:10px; letter-spacing:0.1em; color:var(--label-strong); opacity:calc(0.92 * var(--op-boost)); }
  .work-task{ display:block; font-size:9.5px; color:var(--label-muted); opacity:calc(0.7 * var(--op-boost)); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
  .work-status{ flex:none; font-size:8px; letter-spacing:0.14em; padding:2px 8px; border-radius:999px; border:1px solid rgba(var(--hair-rgb),0.16); white-space:nowrap; opacity:calc(0.85 * var(--op-boost)); }
  .work-status.working{ color:var(--label-strong); border-color:rgba(var(--hair-rgb),0.32); }
  .work-status.waiting{ color:var(--label-muted); opacity:calc(0.55 * var(--op-boost)); }
  .work-status.complete{ color:var(--label-muted); opacity:calc(0.4 * var(--op-boost)); border-color:rgba(var(--hair-rgb),0.08); }
  .work-empty{ font-size:10px; color:var(--label-muted); opacity:calc(0.35 * var(--op-boost)); }
  .work-more{ font-size:9px; color:var(--label-muted); opacity:calc(0.4 * var(--op-boost)); padding:5px 0 0; }
  .work-section-label{ font-size:7.5px; letter-spacing:0.22em; color:var(--label-muted); opacity:calc(0.32 * var(--op-boost)); margin:10px 0 4px; }

  #controls{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:7px;
    max-width:94vw; z-index:10;
  }
  .control-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
  }
  .row-caption{
    font-size:8px; letter-spacing:0.26em; color:var(--label-muted); opacity:calc(0.36 * var(--op-boost));
    margin-bottom:-2px;
  }
  #controls .divider{
    width:1px; align-self:stretch; background:rgba(var(--hair-rgb),0.12); margin:2px 4px;
  }

  button.lx-btn{
    appearance:none;
    border:1px solid rgba(var(--hair-rgb),0.13);
    background:rgba(var(--glass-rgb),0.45);
    color:var(--label-strong);
    font-size:10px;
    letter-spacing:0.06em;
    padding:6px 11px;
    border-radius:5px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .25s ease, border-color .25s ease, transform .15s ease, opacity .25s ease;
    opacity:calc(0.68 * var(--op-boost));
  }
  button.lx-btn:hover{ opacity:calc(1 * var(--op-boost)); background:rgba(var(--hair-rgb),0.09); border-color:rgba(var(--hair-rgb),0.32); }
  button.lx-btn:disabled{ cursor:not-allowed; pointer-events:none; }
  button.lx-btn:active{ transform:scale(0.94); }
  button.lx-btn.state-btn.is-active{ opacity:calc(1 * var(--op-boost)); background:rgba(var(--hair-rgb),0.14); border-color:rgba(var(--hair-rgb),0.45); }
  button.lx-btn.warn-btn{ border-color:rgba(var(--warn-rgb),0.22); }
  button.lx-btn.warn-btn:hover{ background:rgba(var(--warn-rgb),0.12); border-color:rgba(var(--warn-rgb),0.4); }
  button.lx-btn.deleg-btn{ font-size:9px; }
  button.lx-btn.demo-btn{
    font-size:10px; letter-spacing:0.12em;
    border-color:rgba(var(--hair-rgb),0.28);
    background:rgba(var(--hair-rgb),0.07);
    opacity:calc(0.88 * var(--op-boost));
  }
  button.lx-btn.demo-btn:hover{ background:rgba(var(--hair-rgb),0.14); border-color:rgba(var(--hair-rgb),0.5); }
  button.lx-btn.sound-btn.is-on{ opacity:calc(1 * var(--op-boost)); background:rgba(var(--hair-rgb),0.12); border-color:rgba(var(--hair-rgb),0.4); }

  .mini-ring{
    position:fixed; left:22px; bottom:22px; width:56px; height:56px;
    border-radius:50%; border:1px solid rgba(var(--hair-rgb),0.08);
    pointer-events:none; z-index:6;
  }
  canvas#mini{
    position:fixed; left:22px; bottom:22px; width:56px; height:56px;
    display:block; pointer-events:none;
    filter:drop-shadow(0 0 10px rgba(var(--mini-glow-rgb),0.18));
    z-index:6;
  }
  #miniLabel{
    position:fixed; left:22px; bottom:82px;
    font-size:8.5px; letter-spacing:0.2em; color:var(--label-muted); opacity:calc(0.45 * var(--op-boost));
    z-index:6; pointer-events:none;
  }

  @media (max-width:1000px){
    #sidebar{ width:220px; }
  }
  @media (max-width:820px){
    #sidebar, #sidebarToggle, #themeToggle{ display:none; }
  }
  @media (max-width:760px){
    button.lx-btn{ padding:6px 9px; font-size:9px; }
    .model-task{ font-size:9px; padding:3px 8px; }
  }
  /* Anyone with the OS-level "reduce motion" preference gets an instant
     theme swap instead of a cross-fade — this only touches CSS-driven
     transitions/animations; it does not touch the canvas renderer, which
     is math-driven and part of the LANUX identity, not decoration. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      transition-duration:0.001ms !important;
      animation-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>

<div id="topLabel"><span class="headerName" id="headerName">LANUX S5</span><span class="sub" id="headerPurpose">Commander / Master Orchestrator</span></div>
<div id="statusBar"><span id="statusText">IDLE</span></div>

<button id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Switch to light theme">
  <span class="theme-toggle-thumb"></span>
</button>

<button id="sidebarToggle" aria-label="Toggle information sidebar">
  <span id="sidebarToggleIcon">›</span>
</button>

<div id="sidebar">
  <div id="feedPanel" class="sidebar-panel">
    <div class="panel-caption">INTERNAL ACTIVITY</div>
    <div id="feedBody"></div>
  </div>
  <div id="workHistoryPanel" class="sidebar-panel">
    <div class="panel-caption">ACTIVE WORK</div>
    <div id="workBody"></div>
    <div class="panel-caption panel-caption-sub">HISTORY</div>
    <div id="historyBody"></div>
  </div>
</div>

<div id="stage">
  <canvas id="main"></canvas>
  <div id="overlay"></div>
</div>

<div class="mini-ring"></div>
<canvas id="mini"></canvas>
<div id="miniLabel">LANUX PRESENT</div>

<div id="controls">
  <div class="row-caption">VOICE / REACTIONS</div>
  <div class="control-row">
    <button class="lx-btn state-btn" data-mode="idle">IDLE</button>

<script>
(function(){
  "use strict";

  /* =================================================================
     PALETTE & MATH HELPERS
  ================================================================= */
  // Dark identity — exactly the values this file has always used.
  const PALETTE_DARK = {
    c1:{r:0xAB,g:0xBE,b:0xD3},
    c2:{r:0xB0,g:0xBF,b:0xD1},
    c3:{r:0xB9,g:0xC3,b:0xD0},
    c4:{r:0xCF,g:0xDE,b:0xEA},
  };
  // Light identity — same blue-grey hue family (~215°), same relative
  // ordering (c4 the strongest/most-detailed tone, c1 the softest), just
  // re-valued dark-on-light instead of light-on-dark so contrast against
  // the official #F6F9FD page background is preserved rather than lost.
  // Not a hue shift, not an invert — the same restrained mist/blue-grey
  // identity, mirrored the same way the official light --text (#12161F)
  // and --text-muted (#5B6478) mirror the dark theme's pale tokens.
  const PALETTE_LIGHT = {
    c1:{r:0x81,g:0x91,b:0xA7},
    c2:{r:0x5E,g:0x71,b:0x8D},
    c3:{r:0x44,g:0x54,b:0x6A},
    c4:{r:0x2C,g:0x36,b:0x44},
  };
  // The live palette every draw call reads from. Its four properties are
  // overwritten in place every frame (see updateThemeMix), so none of the
  // ~20 existing PALETTE.c1..c4 call sites in the renderer need to change.
  const PALETTE = {
    c1:{r:PALETTE_DARK.c1.r,g:PALETTE_DARK.c1.g,b:PALETTE_DARK.c1.b},
    c2:{r:PALETTE_DARK.c2.r,g:PALETTE_DARK.c2.g,b:PALETTE_DARK.c2.b},
    c3:{r:PALETTE_DARK.c3.r,g:PALETTE_DARK.c3.g,b:PALETTE_DARK.c3.b},
    c4:{r:PALETTE_DARK.c4.r,g:PALETTE_DARK.c4.g,b:PALETTE_DARK.c4.b},
  };
  // official LANUX --error token (#E4685D), blended in at low weight during
  // WARNING so it reads as "requires attention" rather than an alarm
  // colour — identical in both themes, exactly as the colour reference
  // specifies ("Error ... same value as dark theme").
  const WARN_TINT = {r:0xE4,g:0x68,b:0x5D};
  // FORGE-only: a small vocabulary of code-like glyphs. Nodes occasionally
  // render as one of these instead of a plain dot — meant to read as
  // "neurons becoming instructions", not falling Matrix-style text.
  const GLYPH_CHARS = ["0","1","{","}","<",">","/","#",";","=","+","-","(",")"];

  function rgba(c,a){ return "rgba("+Math.round(c.r)+","+Math.round(c.g)+","+Math.round(c.b)+","+a+")"; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function mixColor(c1,c2,t){ return {r:lerp(c1.r,c2.r,t), g:lerp(c1.g,c2.g,t), b:lerp(c1.b,c2.b,t)}; }
  function mixColorInto(target,c1,c2,t){ target.r=lerp(c1.r,c2.r,t); target.g=lerp(c1.g,c2.g,t); target.b=lerp(c1.b,c2.b,t); }

  // 0 = fully dark palette, 1 = fully light palette. Eased toward
  // themeMixTarget every frame in updateThemeMix() so the sphere system
  // cross-fades in step with the CSS theme transition, rather than
  // snapping colour the instant the toggle is clicked.
  let themeMix = 0;
  let themeMixTarget = 0;
  let themeMixSettled = true; // true once themeMix has reached its target — skips redundant work
  function updateThemeMix(){
    if (themeMixSettled) return;
    if (Math.abs(themeMix - themeMixTarget) < 0.001){
      themeMix = themeMixTarget;
      themeMixSettled = true;
    } else {
      themeMix = lerp(themeMix, themeMixTarget, 0.08);
    }
    mixColorInto(PALETTE.c1, PALETTE_DARK.c1, PALETTE_LIGHT.c1, themeMix);
    mixColorInto(PALETTE.c2, PALETTE_DARK.c2, PALETTE_LIGHT.c2, themeMix);
    mixColorInto(PALETTE.c3, PALETTE_DARK.c3, PALETTE_LIGHT.c3, themeMix);
    mixColorInto(PALETTE.c4, PALETTE_DARK.c4, PALETTE_LIGHT.c4, themeMix);
  }

  // Originkit "Particle Surge"-style envelope: exponential decay times a
  // cosine, so an event fires outward, overshoots, rings back and settles
  // — used for decision/acknowledge/completion pulses instead of a plain
  // sine hump, giving communication events a physical "impulse" feel.
  function elasticSurge(p){
    return Math.exp(-p*5.5) * Math.cos(p*Math.PI*2.4);
  }

  /* =================================================================
     PROCEDURAL AUDIO — tiny Web Audio synth engine. No external audio
     files of any kind; every sound is a synthesized oscillator/noise
     burst with a short envelope. Silent until the user explicitly
     enables it (browser autoplay policy + explicit consent), and the
     AudioContext is only created/resumed from inside a real click
     handler. The preference persists via localStorage.
  ================================================================= */
  const AudioEngine = (function(){
    let ctx = null, master = null, enabled = false;
    try { enabled = localStorage.getItem("lanuxSoundOn") === "1"; } catch(e){}

    function ensureCtx(){
      if (ctx) return ctx;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.16; // hard ceiling — sound never dominates
        master.connect(ctx.destination);
      } catch(e){ ctx = null; }
      return ctx;
    }

    function setEnabled(v){
      enabled = v;
      try { localStorage.setItem("lanuxSoundOn", v ? "1" : "0"); } catch(e){}
      if (v){
        const c = ensureCtx();
        if (c && c.state === "suspended") c.resume();
      }
    }
    function isEnabled(){ return enabled; }

    // the entire sound vocabulary is this one short synthesized blip,
    // varied only by frequency / wave shape / duration / pitch-slide —
    // deliberately not musical, not game-like, not alarm-like
    function pulse(o){
      if (!enabled) return;
      const c = ensureCtx();
      if (!c || c.state !== "running") return;
      o = o || {};
      const dur = o.dur || 0.09;
      const t0 = c.currentTime + (o.delay||0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.freq||420, t0);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,(o.freq||420)*o.slide), t0+dur);
      const vol = o.vol===undefined ? 1 : o.vol;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0+Math.min(0.012,dur*0.25));
      gain.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
      osc.connect(gain); gain.connect(master);
      osc.start(t0); osc.stop(t0+dur+0.02);
    }

    // a soft filtered-noise breath, used sparingly for a low "processing
    // texture" underneath a pulse (S5 thinking/acknowledging)
    function noiseTexture(o){
      if (!enabled) return;
      const c = ensureCtx();
      if (!c || c.state !== "running") return;
      o = o || {};
      const dur = o.dur || 0.22;
      const t0 = c.currentTime + (o.delay||0);
      const size = Math.max(1, Math.floor(c.sampleRate*dur));
      const buffer = c.createBuffer(1, size, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<size;i++){ data[i] = (Math.random()*2-1) * (1 - i/size); }
      const src = c.createBufferSource();
      src.buffer = buffer;
      const filt = c.createBiquadFilter();
      filt.type = "bandpass";
      filt.frequency.value = o.freq || 300;
      filt.Q.value = 1.2;
      const gain = c.createGain();
      const vol = o.vol===undefined ? 0.4 : o.vol;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
      src.connect(filt); filt.connect(gain); gain.connect(master);
      src.start(t0);
    }

    return { setEnabled:setEnabled, isEnabled:isEnabled, pulse:pulse, noiseTexture:noiseTexture };
  })();

  // per-model timbre — identity comes primarily from pitch/wave-shape,
  // exactly as with the visual system: same restrained vocabulary,
  // different "voice" per neural system
  const SOUND_VOICES = {
    controller: { freq:170, type:"sine" },
    scout:      { freq:360, type:"sine" },
    forge:      { freq:660, type:"square" },
    architect:  { freq:230, type:"triangle" },
    artisan:    { freq:420, type:"sine" },
    sentinel:   { freq:540, type:"triangle" },
    vector:     { freq:260, type:"triangle" },
    pilot:      { freq:200, type:"sawtooth" },
    memory:     { freq:300, type:"sine" },
    watcher:    { freq:920, type:"square" },
    hackathon:  { freq:580, type:"sawtooth" },
  };

  function playWorkingPattern(entity, voice){
    const style = entity.variant.soundStyle;
    if (style === "precise"){ // Forge — rapid precise ticks
      [0,0.06,0.12].forEach(function(d,i){ AudioEngine.pulse({freq:voice.freq*(1+i*0.06), dur:0.035, type:voice.type, vol:0.30, delay:d}); });
    } else if (style === "flowing"){ // Scout — one soft drifting pulse
      AudioEngine.pulse({freq:voice.freq, dur:0.35, type:voice.type, vol:0.26, slide:1.6});
    } else if (style === "measured"){ // Architect — slow structured double-pulse
      AudioEngine.pulse({freq:voice.freq*0.9, dur:0.20, type:voice.type, vol:0.26});
      AudioEngine.pulse({freq:voice.freq*1.15, dur:0.18, type:voice.type, vol:0.22, delay:0.24});
    } else if (style === "refined"){ // Artisan — smooth rising tone
      AudioEngine.pulse({freq:voice.freq*0.9, dur:0.30, type:voice.type, vol:0.24, slide:1.35});
    } else if (style === "diagnostic"){ // Sentinel — short defensive pulses
      [0,0.08].forEach(function(d){ AudioEngine.pulse({freq:voice.freq, dur:0.05, type:voice.type, vol:0.28, delay:d}); });
    } else if (style === "organized"){ // Vector — one slow low pulse
      AudioEngine.pulse({freq:voice.freq*0.85, dur:0.30, type:voice.type, vol:0.28});
    } else if (style === "scan"){ // Watcher — tick, tick, tick, response
      [0,0.09,0.18].forEach(function(d){ AudioEngine.pulse({freq:voice.freq, dur:0.03, type:voice.type, vol:0.26, delay:d}); });
      AudioEngine.pulse({freq:voice.freq*1.4, dur:0.08, type:voice.type, vol:0.28, delay:0.30});
    } else if (style === "directional"){ // Pilot — command, action, feedback
      AudioEngine.pulse({freq:voice.freq,      dur:0.05, type:voice.type, vol:0.30, delay:0});
      AudioEngine.pulse({freq:voice.freq*1.3,  dur:0.06, type:voice.type, vol:0.26, delay:0.10});
      AudioEngine.pulse({freq:voice.freq*0.9,  dur:0.07, type:voice.type, vol:0.22, delay:0.22});
    } else if (style === "soft"){ // Memory — gentle recall/association pulses
      AudioEngine.pulse({freq:voice.freq, dur:0.16, type:voice.type, vol:0.22});
      AudioEngine.pulse({freq:voice.freq*1.2, dur:0.14, type:voice.type, vol:0.18, delay:0.18});
    } else if (style === "experimental"){ // Hackathon — irregular unusual pulses
      [0,0.05,0.14,0.17].forEach(function(d,i){
        AudioEngine.pulse({freq:voice.freq*(0.8+Math.random()*0.7), dur:0.04, type:i%2?"square":voice.type, vol:0.22, delay:d});
      });
    } else { // "core" — S5, layered processing pulse + soft texture
      AudioEngine.pulse({freq:voice.freq, dur:0.18, type:voice.type, vol:0.28});
      AudioEngine.noiseTexture({freq:voice.freq*2, dur:0.22, vol:0.10, delay:0.03});
    }
  }

  // maps a visual effect/event name to a restrained, model-flavoured sound.
  // Every entry here is a discrete, rate-limited EVENT — never a per-frame
  // or per-signal sound, so this can never spam the listener.
  function playModelSound(entity, kind){
    if (!AudioEngine.isEnabled()) return;
    const voice = SOUND_VOICES[entity.variantKey] || SOUND_VOICES.controller;
    if (kind === "select"){
      AudioEngine.pulse({freq:voice.freq*1.2, dur:0.06, type:voice.type, vol:0.35});
    } else if (kind === "decision"){
      AudioEngine.pulse({freq:voice.freq*0.9, dur:0.14, type:voice.type, vol:0.5, slide:1.3});
    } else if (kind === "receive"){
      AudioEngine.pulse({freq:voice.freq*1.05, dur:0.08, type:voice.type, vol:0.32});
    } else if (kind === "ack"){
      AudioEngine.pulse({freq:voice.freq*0.8, dur:0.12, type:voice.type, vol:0.36});
      AudioEngine.noiseTexture({freq:voice.freq*1.5, dur:0.15, vol:0.10, delay:0.02});
    } else if (kind === "complete"){
      AudioEngine.pulse({freq:voice.freq*1.3, dur:0.09, type:voice.type, vol:0.30});
      AudioEngine.pulse({freq:voice.freq*1.6, dur:0.11, type:voice.type, vol:0.26, delay:0.09});
    } else if (kind === "warning"){
      // deliberately restrained and low — never an alarm
      AudioEngine.pulse({freq:voice.freq*0.55, dur:0.22, type:"sine", vol:0.34, slide:0.75});
    } else if (kind === "notice"){
      AudioEngine.pulse({freq:voice.freq*1.4, dur:0.045, type:voice.type, vol:0.14});
    } else if (kind === "working"){
      playWorkingPattern(entity, voice);
    }
  }


  /* =================================================================
     MODEL DEFINITIONS — authoritative LANUX architecture: S5 + 10
  ================================================================= */
  const MODEL_ORDER = ["s5","scout","forge","architect","artisan","sentinel","vector","pilot","memory","watcher","hackathon"];
  const MODEL_META = {
    s5:        { name:"LANUX S5", purpose:"Commander / Master Orchestrator",     role:"CONTROLLER",  variant:"controller", particles:480 },
    scout:     { name:"SCOUT",     purpose:"Internet / Web Intelligence",         role:"SPECIALIST", variant:"scout",      particles:170 },
    forge:     { name:"FORGE",     purpose:"Coding / Software Engineering",       role:"SPECIALIST", variant:"forge",      particles:170 },
    architect: { name:"ARCHITECT", purpose:"System Architecture",                 role:"SPECIALIST", variant:"architect",  particles:170 },

    sentinel:  { name:"SENTINEL",  purpose:"Security / Permissions",              role:"SPECIALIST", variant:"sentinel",   particles:170 },
    vector:    { name:"VECTOR",    purpose:"Planning / Strategy",                 role:"SPECIALIST", variant:"vector",     particles:170 },
    pilot:     { name:"PILOT",     purpose:"Computer / Environment Execution",    role:"SPECIALIST", variant:"pilot",      particles:170 },
    memory:    { name:"MEMORY",    purpose:"Memory / Project Context",            role:"SPECIALIST", variant:"memory",     particles:170 },
    watcher:   { name:"WATCHER",   purpose:"Verification / Quality Control",      role:"SPECIALIST", variant:"watcher",    particles:170 },
    hackathon: { name:"HACKATHON", purpose:"Experimental / Creative Problem Solving", role:"SPECIALIST", variant:"hackathon", particles:170 },
  };
  // fixed left/right command-center slots (5 per side) — never a circular
  // orbit. Whichever entity is NOT the current center occupies exactly one
  // of these ten slots; when a specialist becomes the center, S5 simply

  const HOME_SLOTS = {
    left0:"scout",   left1:"architect", left2:"sentinel",  left3:"memory",   left4:"hackathon",
    right0:"forge",  right1:"artisan",  right2:"vector",   right3:"pilot",   right4:"watcher"

  function getSlotAssignment(){
    if (activeMain === "s5") return Object.assign({}, HOME_SLOTS);
    const slots = Object.assign({}, HOME_SLOTS);
    for (const key in slots){
      if (slots[key] === activeMain){ slots[key] = "s5"; break; }

  }
  const TASKS = {
    scout:     "Research OAuth requirements",
    forge:     "Implement authentication flow",

    sentinel:  "Audit authentication permissions",

    pilot:     "Run automated build",
    memory:    "Recall prior auth decisions",

    hackathon: "Prototype passwordless login",
  };
  const VARIANTS = {
    // S5 — dense multi-layer neural mesh, asymmetric, highest complexity.
    // Nodes read as neurons (a faint halo ring on the nearer ones) rather
    // than decorative dots.
    controller: { jitterMul:0.55, structuredBase:0,    ringCount:4, ringProminence:1.30, pulseFreq:0,   rotSpeed:0.045, asym:true,  extraShell:true,
                  gimbalLayers:3, harmonicShell:{lobes:3,rings:2,ampFactor:0.05}, liquidWave:{count:2,speed:0.3,ampFactor:0.018}, surgeAmount:1.3,
                  topology:"core-layers", signalRate:420, signalDuration:750, soundStyle:"core", coreStyle:"nucleus", nodeShape:"neuron" },
    // Scout — exploratory web-intelligence network; branches form/fade,
    // nodes are small outward-pointing "probes" rather than plain dots,
    // and the topology rewires faster whenever Scout is actually active
    scout:      { jitterMul:1.45, structuredBase:0,    ringCount:2, ringProminence:0.60, pulseFreq:0,   rotSpeed:0.060,
                  liquidWave:{count:5,speed:0.8,ampFactor:0.035}, surgeAmount:0.8,
                  topology:"branch-dynamic", dynamicTopology:true, signalRate:700, signalDuration:850, soundStyle:"flowing", coreStyle:"ping", nodeShape:"teardrop" },
    // Forge — rigid lattice that periodically manifests as code glyphs;
    // its non-glyph nodes are small precise blocks, not soft dots
    forge:      { jitterMul:0.16, structuredBase:0.28, ringCount:2, ringProminence:0.65, pulseFreq:0,   rotSpeed:0.10,
                  gimbalLayers:2, surgeAmount:0.9,
                  topology:"lattice", signalRate:480, signalDuration:400, soundStyle:"precise", codeGlyphs:true, coreStyle:"bracket", nodeShape:"block" },
    // Architect — nested hierarchical layers; nodes are structural blocks,
    // and the whole mesh visibly pulls toward an organized lattice while
    // Architect is WORKING (deliberate construction, not a random jitter)
    architect:  { jitterMul:0.16, structuredBase:0.12, ringCount:3, ringProminence:1.05, pulseFreq:0,   rotSpeed:0.040, reorganizeOnWork:0.30,
                  gimbalLayers:2, surgeAmount:0.85,
                  topology:"hierarchy", signalRate:1000, signalDuration:850, soundStyle:"measured", coreStyle:"hex", nodeShape:"layer" },
    // Artisan — flowing organic pattern formation; soft blurred nodes, and
    // a gentler version of the same reorganize-on-work pull reads as
    // "refinement" rather than "construction"
    artisan:    { jitterMul:0.75, structuredBase:0,    ringCount:2, ringProminence:0.85, pulseFreq:0,   rotSpeed:0.065, reorganizeOnWork:0.14,
                  harmonicShell:{lobes:4,rings:3,ampFactor:0.06}, liquidWave:{count:3,speed:0.4,ampFactor:0.04}, surgeAmount:0.8,
                  topology:"morph", signalRate:850, signalDuration:900, soundStyle:"refined", coreStyle:"petal", nodeShape:"soft" },
    // Sentinel — perimeter defense: double shell + scanning arcs; nodes
    // render as short perimeter tick-marks, and WARNING selectively lights
    // only the outer-shell nodes instead of tinting the whole sphere
    sentinel:   { jitterMul:0.22, structuredBase:0.08, ringCount:2, ringProminence:1.0,  pulseFreq:0,   rotSpeed:0.075, extraShell:true, perimeterScan:true, selectiveWarning:true,
                  harmonicShell:{lobes:6,rings:2,ampFactor:0.032}, surgeAmount:1.0,
                  topology:"perimeter", signalRate:650, signalDuration:450, soundStyle:"diagnostic", coreStyle:"guard", nodeShape:"tick" },
    // Vector — organized clusters linked by route pathways; nodes are
    // small diamond waypoints, and WORKING converges all signal traffic
    // onto one "chosen route" while the rest of the mesh dims
    vector:     { jitterMul:0.30, structuredBase:0,    ringCount:3, ringProminence:1.10, pulseFreq:0,   rotSpeed:0.050, routeConverge:true,
                  surgeAmount:1.5,
                  topology:"clusters", signalRate:900, signalDuration:800, soundStyle:"organized", coreStyle:"ticks", nodeShape:"waypoint" },
    // Pilot — directional meridian pathways; nodes are short radial dashes

    pilot:      { jitterMul:0.10, structuredBase:0.08, ringCount:2, ringProminence:0.90, pulseFreq:0,   rotSpeed:0.130, sweep:true,
                  surgeAmount:1.5,
                  topology:"meridian", signalRate:460, signalDuration:500, soundStyle:"directional", coreStyle:"arrow", nodeShape:"dash" },
    // Memory — associative clusters; nodes render as tight twin pairs, a
    // visual shorthand for "this node is linked to something nearby"
    memory:     { jitterMul:0.26, structuredBase:0,    ringCount:2, ringProminence:0.85, pulseFreq:0,   rotSpeed:0.045,
                  gimbalLayers:2, surgeAmount:0.8,
                  topology:"associative", signalRate:820, signalDuration:950, soundStyle:"soft", coreStyle:"ripple", nodeShape:"pair" },
    // Watcher — distributed inspection network; nodes are tiny crosshair
    // marks, and TWO independent scan bands sweep at different speeds so
    // multiple regions are visibly being checked at once, not just one.
    // Deliberately no harmonic shell / gimbal layers here — that visual
    // vocabulary belongs to Sentinel, and Watcher must read as distinct
    // (observation/verification, not perimeter defense).
    watcher:    { jitterMul:0.34, structuredBase:0,    ringCount:2, ringProminence:0.80, pulseFreq:1.6, rotSpeed:0.095, scanBand:true, scanBand2:true,
                  surgeAmount:0.9,
                  topology:"scan", signalRate:1300, signalDuration:480, soundStyle:"scan", coreStyle:"iris", nodeShape:"cross" },
    // Hackathon — rapidly rewiring, unconventional but controlled; nodes
    // are small irregular sparks, the rewiring itself accelerates further
    // while WORKING (visibly trying alternatives) before easing, and a
    // shifting-frequency liquid wave reads as deliberate structural
    // mutation rather than random noise
    hackathon:  { jitterMul:0.9,  structuredBase:0,    ringCount:2, ringProminence:0.75, pulseFreq:0,   rotSpeed:0.11, dynamicTopology:true, fastFlip:true,
                  liquidWave:{count:7,speed:1.2,ampFactor:0.045,erratic:true}, surgeAmount:1.1,
                  topology:"adaptive", signalRate:560, signalDuration:520, soundStyle:"experimental", coreStyle:"flicker", nodeShape:"spark" },
  };


  /* =================================================================
     NEURAL TOPOLOGY — each variant gets a distinct connection graph
     between its own node indices, generated once at build time. This
     (plus the signals that travel along it) is what turns a particle
     cloud into something that reads as a specific neural system.
  ================================================================= */
  function buildConnections(particles, variant){
    const n = particles.length;
    const conns = [];
    function add(i,j,alpha){
      if (i===j || i<0 || j<0 || i>=n || j>=n) return;
      conns.push({ a:i, b:j, alpha: alpha===undefined?1:alpha, target: alpha===undefined?1:alpha });
    }
    const topology = variant.topology;

    if (topology === "lattice"){
      // Forge — a rigid mesh: short chain links plus periodic cross-braces
      const step = Math.max(1, Math.floor(n/70));
      for (let i=0;i<n;i+=step){
        add(i, i+step);
        if ((i/step)%3===0) add(i, i+step*2);
      }
    } else if (topology === "branch-dynamic"){
      // Scout — long, sparse, organic links; half start dormant and
      // fade in/out over time (see updateDynamicTopology)
      const count = Math.floor(n*0.24);
      for (let k=0;k<count;k++){
        const i = Math.floor(Math.random()*n);
        const spread = (Math.random()-0.5)*n*0.6;
        const j = Math.floor(clamp(i+spread, 0, n-1));
        add(i, j, Math.random()<0.5 ? 1 : 0);
      }
    } else if (topology === "clusters"){
      // Vector — nodes grouped into clusters, dense within, linked hub-to-hub
      const clusterCount = 5;
      const size = Math.floor(n/clusterCount) || 1;
      for (let c=0;c<clusterCount;c++){
        const start = c*size, end = Math.min(n, start+size);
        for (let i=start;i<end-3;i+=3) add(i, i+3);
        add(start, ((c+1)%clusterCount)*size);
      }
    } else if (topology === "scan"){
      // Watcher — deliberately sparse static mesh; identity comes from the
      // scanning band (handled per-particle), not from a dense web
      const count = Math.floor(n*0.05);
      for (let k=0;k<count;k++){
        add(Math.floor(Math.random()*n), Math.floor(Math.random()*n));
      }
    } else if (topology === "meridian"){
      // Pilot — interleaved "conveyor" bands running across the sphere
      const bins = 9;
      const perBin = Math.floor(n/bins);
      for (let b=0;b<bins;b++){
        for (let k=0;k<perBin-1;k++){
          add(b+k*bins, b+(k+1)*bins);
        }
      }
    } else if (topology === "hierarchy"){
      // Architect — nested dependency layers: every non-root level connects
      // up to a proportional "parent" node in the level above, plus a few
      // sibling braces within each level for a stable framework feel
      const levels = [0, Math.floor(n*0.12), Math.floor(n*0.38), Math.floor(n*0.68), n];
      for (let lv=1; lv<levels.length-1; lv++){
        const start=levels[lv], end=levels[lv+1];
        const pStart=levels[lv-1], pCount=Math.max(1,start-pStart);
        for (let i=start;i<end;i++){
          const parent = pStart + Math.floor(((i-start)/Math.max(1,end-start))*pCount);
          add(i, parent);
        }
      }
      for (let lv=0; lv<levels.length-1; lv++){
        const start=levels[lv], end=levels[lv+1];
        for (let i=start;i+4<end;i+=4) add(i, i+4);
      }
    } else if (topology === "morph"){
      // Artisan — a smooth flowing chain plus a few elegant long sweeping
      // arcs, giving refined curves rather than a rigid grid
      const step = Math.max(1, Math.floor(n/90));
      for (let i=0;i+step<n;i+=step) add(i, i+step, 0.9);
      const sweeps = Math.floor(n*0.045);
      for (let k=0;k<sweeps;k++){
        const i = Math.floor(Math.random()*n*0.5);
        const j = Math.floor(n*0.5 + Math.random()*n*0.5);
        add(i, j, 0.55);
      }
    } else if (topology === "perimeter"){
      // Sentinel — tight perimeter ring-bands (a spiral index range approximates
      // a tight local ring here) plus a few inward spokes toward the core,
      // reading as a defensive shell with occasional inspection lines
      const bandSize = Math.max(2, Math.floor(n/26));
      for (let i=0;i+bandSize<n;i+=bandSize){
        for (let k=0;k<bandSize-1;k++) add(i+k, i+k+1);
      }
      const spokes = Math.floor(n*0.05);
      for (let k=0;k<spokes;k++){
        add(Math.floor(Math.random()*n), Math.floor(n/2), 0.5);
      }
    } else if (topology === "associative"){
      // Memory — overlapping associative links: each connection ties a node
      // to another node in a loosely nearby "region", so activating one area
      // visibly implicates its neighbors rather than an isolated node
      const count = Math.floor(n*0.34);
      for (let k=0;k<count;k++){
        const i = Math.floor(Math.random()*n);
        const j = Math.floor(clamp(i + (Math.random()-0.5)*n*0.30, 0, n-1));
        add(i, j, 0.85);
      }
    } else if (topology === "adaptive"){
      // Hackathon — a large pool of mostly-dormant candidate links, rewired
      // rapidly (see updateDynamicTopology's fastFlip handling)
      const count = Math.floor(n*0.4);
      for (let k=0;k<count;k++){
        add(Math.floor(Math.random()*n), Math.floor(Math.random()*n), Math.random()<0.3 ? 1 : 0);
      }
    } else {
      // "core-layers" (S5) — dense local mesh plus sparse long asymmetric links
      const step = Math.max(1, Math.floor(n/120));
      for (let i=0;i<n;i+=step) add(i, i+step);
      const longLinks = Math.floor(n*0.05);
      for (let k=0;k<longLinks;k++){
        add(Math.floor(Math.random()*n), Math.floor(Math.random()*n), 0.55);
      }
    }
    return conns;
  }

  // Scout/Hackathon-style variants: every so often, a handful of dormant
  // links wake up and a few active ones go dormant — the network visibly
  // rewires itself rather than sitting static. Hackathon flips faster and
  // touches more links per cycle, per its "rapid restructuring" identity.
  // Either variant rewires noticeably faster while actually active (voice
  // state or task state), then eases back to its calmer idle rate —
  // Hackathon's WORKING state reads as "trying alternatives before settling".
  function updateDynamicTopology(entity, now){
    const fast = !!entity.variant.fastFlip;
    const busy = entity.taskState!=="idle" || entity.mode!=="idle";
    if (!entity.nextTopologyFlip || now > entity.nextTopologyFlip){
      const intervalBase = fast ? (500+Math.random()*500) : (1500+Math.random()*1200);
      entity.nextTopologyFlip = now + (busy ? intervalBase*0.45 : intervalBase);
      const conns = entity.connections;
      const flips = Math.round((fast ? 9 : 4) * (busy ? 1.6 : 1));
      for (let k=0;k<flips;k++){
        const c = conns[Math.floor(Math.random()*conns.length)];
        if (c) c.target = c.target > 0.5 ? 0 : 1;
      }
    }
    entity.connections.forEach(function(c){ c.alpha = lerp(c.alpha, c.target, fast ? 0.10 : 0.04); });
  }


  const EFFECT_DURATIONS = {
    lanux:700, think:1900, search:1600, code:1700, warning:2600,
    click:500, notice:380, decision:900, ack:600, complete:750
  };

  /* =================================================================
     PARTICLE FIELD (Fibonacci sphere)
  ================================================================= */
  function buildParticles(count){
    const arr = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i=0;i<count;i++){
      const yv = 1 - (i/(count-1))*2;
      const rAtY = Math.sqrt(Math.max(0,1-yv*yv));
      const theta = golden*i;
      const x = Math.cos(theta)*rAtY, z = Math.sin(theta)*rAtY, y = yv;
      arr.push({
        x0:x, y0:y, z0:z, theta:theta, phi:Math.acos(clamp(yv,-1,1)),
        seed1:Math.random()*Math.PI*2, seed2:Math.random()*Math.PI*2,
        freq1:0.5+Math.random()*0.6, freq2:0.3+Math.random()*0.5,
        distIndex:i/count, group:i%24
      });
    }
    return arr;
  }
  function structuredVector(p){
    const latSteps=9, lonSteps=14;
    const phiSnap = Math.round(p.phi/(Math.PI/latSteps))*(Math.PI/latSteps);
    const thetaSnap = Math.round(p.theta/(Math.PI*2/lonSteps))*(Math.PI*2/lonSteps);
    const sy=Math.cos(phiSnap), rAtY=Math.sin(phiSnap);
    return { x:Math.cos(thetaSnap)*rAtY, y:sy, z:Math.sin(thetaSnap)*rAtY };
  }

  /* =================================================================
     S5 ARTIFICIAL BRAIN — a persistent internal structure unique to
     S5 (the Commander). Built once and reused every frame; only its
     ACTIVITY changes over time, never its geometry. This is what
     makes S5 read as "the brain that coordinates the specialists"
     rather than "a bigger version of the same particle sphere" —
     the other 10 models are untouched by any of this.

     Anatomy (all in local unit-sphere space, radius 0..~0.62 of the
     sphere's own radius — well inside the existing outer particle
     shell/rings, which continue to serve, unmodified, as S5's outer
     association network):
       - a small dense CORE cluster near the centre (the decision
         region)
       - five asymmetric INNER REGIONS ("lobes") fanned unevenly
         around it, each with its own node count (different neuron
         densities) and its own local branching, not a uniform shell
       - trunk edges (core -> region hub), intra-region edges (dense,
         local), and a handful of sparse inter-region edges (cross-
         talk) — three distinct kinds of connective tissue, echoing
         "layered/branching pathways" rather than one flat mesh
     Every node also carries a fixed per-node seed so idle motion can
     be a persistent, coherent "breathing" rather than noise.
  ================================================================= */
  function buildS5Brain(){
    const nodes = [];   // {x,y,z (direction * radius fraction), seed1, seed2, region}  region:-1 = core
    const edges = [];   // {a,b, region}  region:-1 core/trunk, -2 inter-region, else region index

    const CORE_N = 9;
    for (let i=0;i<CORE_N;i++){
      const yv = 1 - (i/(CORE_N-1))*2;
      const rAtY = Math.sqrt(Math.max(0,1-yv*yv));
      const theta = i*2.399963; // golden-angle-ish scatter, not a neat ring
      const rad = 0.12 + Math.random()*0.07;
      nodes.push({ x:Math.cos(theta)*rAtY*rad, y:yv*rad, z:Math.sin(theta)*rAtY*rad,
        seed1:Math.random()*Math.PI*2, seed2:0.7+Math.random()*0.6, region:-1, core:true });
    }
    for (let i=0;i<CORE_N;i++){
      edges.push({ a:i, b:(i+1)%CORE_N, region:-1 });
      if (i%2===0) edges.push({ a:i, b:(i+4)%CORE_N, region:-1 });
    }

    // five asymmetric directions — hand-placed, not evenly distributed,
    // so the brain has a "this side is denser" character
    const REGION_DIRS = [
      {x:0.86, y:0.26, z:0.14},
      {x:-0.68, y:0.42, z:0.38},
      {x:0.12, y:-0.82, z:0.28},
      {x:-0.52, y:-0.50, z:-0.48},
      {x:0.40, y:0.22, z:-0.82},
    ];
    const REGION_COUNTS = [11, 7, 9, 6, 8]; // deliberately uneven density
    const regions = [];
    REGION_DIRS.forEach(function(dir, ri){
      const len = Math.sqrt(dir.x*dir.x+dir.y*dir.y+dir.z*dir.z) || 1;
      const ux=dir.x/len, uy=dir.y/len, uz=dir.z/len;
      const startIdx = nodes.length;
      const count = REGION_COUNTS[ri];
      // hub: the region's innermost node — the trunk attaches here
      nodes.push({ x:ux*0.30, y:uy*0.30, z:uz*0.30,
        seed1:Math.random()*Math.PI*2, seed2:0.7+Math.random()*0.6, region:ri, hub:true });
      for (let k=1;k<count;k++){
        const spread = 0.36;
        const rad = 0.38 + (k/count)*0.26 + Math.random()*0.08;
        const jx = ux + (Math.random()-0.5)*spread;
        const jy = uy + (Math.random()-0.5)*spread;
        const jz = uz + (Math.random()-0.5)*spread;
        const jlen = Math.sqrt(jx*jx+jy*jy+jz*jz) || 1;
        nodes.push({ x:(jx/jlen)*rad, y:(jy/jlen)*rad, z:(jz/jlen)*rad,
          seed1:Math.random()*Math.PI*2, seed2:0.7+Math.random()*0.6, region:ri });
      }
      const endIdx = nodes.length;
      regions.push({ dir:{x:ux,y:uy,z:uz}, hub:startIdx, start:startIdx, end:endIdx, outer:endIdx-1 });

      // trunk: one core node to this region's hub
      edges.push({ a: ri % CORE_N, b:startIdx, region:ri, trunk:true });

      // intra-region: a loose chain plus a few extra local links
      for (let k=startIdx; k<endIdx-1; k++) edges.push({ a:k, b:k+1, region:ri });
      const extra = Math.round(count*0.4);
      for (let k=0;k<extra;k++){
        const a = startIdx + Math.floor(Math.random()*count);
        const b = startIdx + Math.floor(Math.random()*count);
        if (a!==b) edges.push({ a:a, b:b, region:ri });
      }
    });

    // sparse asymmetric cross-region links — regions talk to each
    // other directly sometimes, not only back through the core
    for (let k=0;k<6;k++){
      const ra = Math.floor(Math.random()*regions.length);
      let rb = Math.floor(Math.random()*regions.length);
      if (rb===ra) rb = (rb+1)%regions.length;
      const a = regions[ra].start + Math.floor(Math.random()*(regions[ra].end-regions[ra].start));
      const b = regions[rb].start + Math.floor(Math.random()*(regions[rb].end-regions[rb].start));
      edges.push({ a:a, b:b, region:-2 });
    }

    return { nodes:nodes, edges:edges, regions:regions, coreCount:CORE_N };
  }

  /* ---- brain activity: picking a region, firing pulse chains ---- */
  function pickBrainRegion(entity, otherId){
    const regions = entity.brain.regions;
    const other = entities[otherId];
    if (!other) return Math.floor(Math.random()*regions.length);
    const dx = other.cur.x - entity.cur.x;
    const candidates = [];
    regions.forEach(function(r,i){ if ((r.dir.x>0)===(dx>=0)) candidates.push(i); });
    const pool = candidates.length ? candidates : regions.map(function(_,i){return i;});
    return pool[Math.floor(Math.random()*pool.length)];
  }

  // fires a short chain of pulses walking outward (dir=1, core->rim) or
  // inward (dir=-1, rim->core) through one region, staggered so activity
  // visibly travels rather than flashing everywhere at once
  function fireBrainChain(entity, regionIdx, dir, opts){
    opts = opts || {};
    const brain = entity.brain;
    const region = brain.regions[regionIdx];
    if (!region) return;
    const now = performance.now();
    const path = [];
    // trunk edge (core <-> hub)
    const trunkEdge = brain.edges.find(function(e){ return e.trunk && e.region===regionIdx; });
    if (trunkEdge) path.push(trunkEdge);
    // walk the intra-region chain from hub toward the outer node
    for (let i=region.start; i<region.outer; i++) path.push({ a:i, b:i+1, region:regionIdx });
    const seq = dir === -1 ? path.slice().reverse() : path;
    const stagger = opts.stagger || 90;
    const hop = opts.hopDuration || 260;
    seq.forEach(function(edge, i){
      entity.brainPulses.push({
        a: dir===-1 ? edge.b : edge.a, b: dir===-1 ? edge.a : edge.b,
        start: now + i*stagger, duration: hop, region: regionIdx, strong: !!opts.strong
      });
    });
    if (dir === 1) entity.brainCoreFlash = Math.max(entity.brainCoreFlash||0, 1);
    else entity.brainCoreFlashDelayed = now + seq.length*stagger; // flash arrives once the chain reaches the core
  }

  function fireBrainInternalBurst(entity, count){
    const brain = entity.brain;
    const now = performance.now();
    for (let i=0;i<count;i++){
      const e = brain.edges[Math.floor(Math.random()*brain.edges.length)];
      entity.brainPulses.push({ a:e.a, b:e.b, start: now + Math.random()*500, duration: 220+Math.random()*160, region:e.region });
    }
  }

  // authoritative once-per-frame update: scheduling only, no drawing.
  // Called once from updateEntities() regardless of how many times S5
  // gets rendered this frame (main sphere + mini mirror both read the
  // same settled state).
  function updateS5Brain(entity, now){
    const brain = entity.brain;
    if (!brain) return;

    // prune expired pulses
    for (let i=entity.brainPulses.length-1;i>=0;i--){
      if (now - entity.brainPulses[i].start > entity.brainPulses[i].duration) entity.brainPulses.splice(i,1);
    }
    if (entity.brainCoreFlash) entity.brainCoreFlash = Math.max(0, entity.brainCoreFlash - 0.045);
    if (entity.brainCoreFlashDelayed && now >= entity.brainCoreFlashDelayed){
      entity.brainCoreFlash = 1;
      entity.brainCoreFlashDelayed = 0;
    }

    // react to state changes — each of these fires at most once per
    // underlying event, via reference-equality against the entity's
    // own effect object (triggerWordOn always creates a fresh one)
    if (entity.effect && entity.effect !== entity._brainFiredFor){
      entity._brainFiredFor = entity.effect;
      const name = entity.effect.name;
      if (name === "decision"){
        const targets = entity.brainDelegateTargets && entity.brainDelegateTargets.length
          ? entity.brainDelegateTargets : [null];
        targets.forEach(function(id){
          fireBrainChain(entity, pickBrainRegion(entity, id), 1, { strong:true });
        });
      } else if (name === "ack"){
        fireBrainChain(entity, pickBrainRegion(entity, entity.brainReturnFrom), -1, { strong:true, hopDuration:220, stagger:75 });
      } else if (name === "think"){
        fireBrainInternalBurst(entity, 7);
      } else if (name === "warning"){
        entity.brainAlertRegion = pickBrainRegion(entity, entity.brainReturnFrom || entity.brainDelegateTargets && entity.brainDelegateTargets[0]);
        entity.brainAlertUntil = now + (entity.tintDuration || 2600);
      }
    }

    // continuous low-level activity, rate depends on current state
    let idleGap = 1900;
    if (entity.mode === "listen") idleGap = 1200;
    if (entity.effect && entity.effect.name === "think") idleGap = 260;
    if (now > entity.brainNextIdleAt){
      entity.brainNextIdleAt = now + idleGap*(0.7+Math.random()*0.7);
      fireBrainInternalBurst(entity, entity.effect && entity.effect.name==="think" ? 2 : 1);
    }

    if (entity.brainAlertUntil && now > entity.brainAlertUntil){
      entity.brainAlertRegion = null;
      entity.brainAlertUntil = 0;
    }
  }

  // pure render: projects the persistent geometry through the SAME
  // rotation already computed for S5's outer shell this frame (the
  // brain turns with the body it's inside), draws connective tissue
  // then nodes then any in-flight pulses. Safe to call more than once
  // per frame (main sphere + mini mirror) — it never mutates state.
  function renderS5Brain(ctx, cx, cy, sphereR, entity, cosY, sinY, cosX, sinX, c1, c3, c4, t, now, amp, opts){
    const brain = entity.brain;
    const lineScale = opts.lineScale || 1;
    const particleScale = opts.particleScale || 1;
    const alert = entity.brainAlertRegion;
    const alertStrength = entity.brainAlertUntil ? clamp((entity.brainAlertUntil-now)/2600, 0, 1) : 0;

    function project(node){
      const wobble = 1 + 0.045*Math.sin(t*(0.5+node.seed2*0.4)+node.seed1)*(0.4+amp*0.8);
      const x = node.x*wobble, y = node.y*wobble, z = node.z*wobble;
      const rx = x*cosY - z*sinY, rz = x*sinY + z*cosY;
      const ry = y*cosX - rz*sinX, rz2 = y*sinX + rz*cosX;
      return { sx:cx+rx*sphereR, sy:cy+ry*sphereR*0.98, depth:(rz2+1)/2 };
    }
    const proj = brain.nodes.map(project);

    function edgeColor(edgeRegion, baseA){
      if (alert!=null && edgeRegion===alert) return rgba(mixColor(c4, WARN_TINT, 0.55*alertStrength), baseA*(1+alertStrength*0.6));
      return rgba(edgeRegion===-1 ? c4 : c3, baseA);
    }

    // connective tissue
    ctx.lineWidth = Math.max(0.5, lineScale*0.7);
    for (let i=0;i<brain.edges.length;i++){
      const e = brain.edges[i];
      const A = proj[e.a], B = proj[e.b];
      if (!A || !B) continue;
      const avgDepth = (A.depth+B.depth)/2;
      let a = (e.region===-1 ? 0.16 : e.trunk ? 0.14 : 0.09) + avgDepth*0.14;
      a *= (0.6+amp*0.7);
      ctx.beginPath();
      ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy);
      ctx.strokeStyle = edgeColor(e.region, clamp(a,0,0.5));
      ctx.stroke();
    }

    // nodes, back-to-front by depth (same convention as drawNodes)
    const order = proj.map(function(p,i){ return i; }).sort(function(i,j){ return proj[i].depth-proj[j].depth; });
    for (let oi=0; oi<order.length; oi++){
      const i = order[oi];
      const node = brain.nodes[i]; const p = proj[i];
      const isAlert = alert!=null && node.region===alert;
      const baseR = (node.core ? 2.0 : node.hub ? 1.7 : 1.25) * particleScale;
      const r = baseR * (0.6+p.depth*0.8);
      const baseA = (node.core ? 0.55 : node.hub ? 0.42 : 0.30) + p.depth*0.25;
      ctx.beginPath();
      ctx.fillStyle = isAlert
        ? rgba(mixColor(c4, WARN_TINT, 0.6*alertStrength), clamp(baseA*1.2,0,1))
        : rgba(node.core ? c4 : c3, clamp(baseA,0,1));
      ctx.arc(p.sx, p.sy, r, 0, Math.PI*2);
      ctx.fill();
    }

    // in-flight pulses — bright travelling points, the visible "signal"
    for (let i=0;i<entity.brainPulses.length;i++){
      const sig = entity.brainPulses[i];
      const p2 = (now - sig.start) / sig.duration;
      if (p2 < 0 || p2 > 1) continue;
      const A = proj[sig.a], B = proj[sig.b];
      if (!A || !B) continue;
      const sxp = lerp(A.sx,B.sx,p2), syp = lerp(A.sy,B.sy,p2);
      const depthp = lerp(A.depth,B.depth,p2);
      const glowEnv = Math.sin(p2*Math.PI);
      const sizeMul = sig.strong ? 1.6 : 1;
      ctx.beginPath();
      ctx.fillStyle = sig.region===alert
        ? rgba(mixColor(c4, WARN_TINT, 0.6*alertStrength), glowEnv)
        : rgba(c4, clamp(0.4+depthp*0.6,0,1)*glowEnv);
      ctx.arc(sxp, syp, lerp(1.3,2.8,depthp)*sizeMul*particleScale, 0, Math.PI*2);
      ctx.fill();
    }

    // core flash — a brief extra bloom layered on the existing core
    // glow, used when activity converges back into the decision region
    if (entity.brainCoreFlash > 0.02){
      const fr = sphereR*0.30*(1+entity.brainCoreFlash*0.5);
      const fg = ctx.createRadialGradient(cx,cy,0, cx,cy, fr);
      fg.addColorStop(0, rgba(c4, 0.5*entity.brainCoreFlash));
      fg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(cx,cy,fr,0,Math.PI*2); ctx.fill();
    }
  }

  /* =================================================================
     ENTITY MODEL
  ================================================================= */
  const entities = {};
  MODEL_ORDER.forEach(function(id){
    const meta = MODEL_META[id];
    const variant = VARIANTS[meta.variant];
    const particles = buildParticles(meta.particles);
    const e = {
      id:id, name:meta.name, purpose:meta.purpose, role:meta.role, variant:variant, variantKey:meta.variant,
      particles: particles,
      connections: buildConnections(particles, variant),
      signals: [], nextSignalAt: 0, nextTopologyFlip: 0, chosenRoute: null,
      cur:{x:0,y:0,r:10}, target:{x:0,y:0,r:10},
      hoverOffset:{x:0,y:0}, hoverBoost:0, hovered:false,
      mode:"idle", effect:null,
      taskState:"idle", taskText:"", workUntil:0,
      tintUntil:0, tintDuration:0,
      smoothedAmp: id==="s5" ? 0.16 : 0.12,
      seedA:Math.random()*1000, seedB:Math.random()*1000, seedC:Math.random()*1000
    };
    if (variant.extraShell){
      e.innerParticles = e.particles.filter(function(_,i){ return i%2===0; });
    }
    if (id === "s5"){
      e.brain = buildS5Brain();
      e.brainPulses = [];
      e.brainNextIdleAt = performance.now() + 600;
      e.brainAlertRegion = null;
      e.brainAlertUntil = 0;
      e.brainCoreFlash = 0;
      e.brainCoreFlashDelayed = 0;
      e.brainDelegateTargets = null;
      e.brainReturnFrom = null;
      e._brainFiredFor = null;
    }
    entities[id] = e;
  });

  let activeMain = "s5";
  const streams = [];       // delegation energy streams
  const systemPulses = [];  // authoritative system-wide warning rings

  /* =================================================================
     EFFECT ENVELOPES
  ================================================================= */
  function effectParams(name, p, variant){
    const out = { ampAdd:0, coreAdd:0, ringAdd:0, structured:0, spiral:0, ripple:0, ripplePhase:0, rotBoost:0, flash:0, tint:0 };
    const surgeAmt = (variant && variant.surgeAmount) || 1;

    if (name==="lanux" || name==="complete"){
      const e = Math.exp(-p*7.5);
      out.flash=e; out.coreAdd=e*0.9; out.ringAdd=Math.sin(p*Math.PI)*0.35; out.ampAdd=e*0.5;
      // Originkit "Particle Surge" — the absorbed/completed pulse rings
      // back and overshoots slightly rather than just decaying smoothly
      const surge = elasticSurge(p)*0.14*surgeAmt;
      out.ampAdd += surge; out.ringAdd += surge*0.8;
      return out;
    }
    if (name==="think"){
      const inPhase=clamp(p/0.5,0,1), outPhase=clamp((p-0.5)/0.5,0,1);
      out.spiral=Math.sin(inPhase*Math.PI)*(1-outPhase*0.3);
      out.coreAdd=Math.sin(clamp(p/0.7,0,1)*Math.PI)*0.8;
      out.rotBoost=(1-p)*1.8;
      out.ampAdd=-0.05*(1-outPhase)+outPhase*0.15;
      return out;
    }
    if (name==="search"){
      out.ripple=Math.sin(p*Math.PI); out.ripplePhase=p;
      out.coreAdd=0.25*(1-p); out.ampAdd=0.1*Math.sin(p*Math.PI);
      return out;
    }
    if (name==="code"){
      out.structured=Math.sin(p*Math.PI);
      const pulses=Math.sin(p*Math.PI*9);
      out.ampAdd=Math.max(0,pulses)*0.28*(1-p*0.4);
      out.coreAdd=Math.max(0,pulses)*0.35;
      out.ringAdd=0.06*Math.max(0,pulses);
      return out;
    }
    if (name==="warning"){
      const warmth=Math.sin(p*Math.PI);
      const cyc=Math.sin(p*Math.PI*3)*(1-p*0.3);
      out.ampAdd=cyc*0.5; out.coreAdd=Math.max(0,cyc)*0.6+warmth*0.15;
      out.ringAdd=cyc*0.24; out.flash=Math.max(0,-cyc)*0.25;
      out.tint=warmth;
      return out;
    }
    if (name==="click"){
      const e=Math.exp(-p*9);
      out.ampAdd=e*0.3; out.coreAdd=e*0.5; out.ringAdd=Math.sin(p*Math.PI)*0.15;
      return out;
    }
    if (name==="notice"){
      const e=Math.exp(-p*10);
      out.flash=e*0.35; out.coreAdd=e*0.25; out.ampAdd=e*0.15;
      return out;
    }
    if (name==="decision"){
      const env=Math.sin(p*Math.PI);
      out.coreAdd=env*1.0; out.ringAdd=-0.12*env+0.05*Math.sin(p*Math.PI*2);
      out.ampAdd=env*0.25; out.flash=env*0.15;
      // the concentrated burst is followed by an outward directional
      // surge — fires, overshoots the shell, rings back — this is the
      // "decision -> outward pulse" the delegation communication needs
      const surge = elasticSurge(p)*0.20*surgeAmt;
      out.ampAdd += surge; out.ringAdd += surge*0.9;
      return out;
    }
    if (name==="ack"){
      const env=Math.sin(p*Math.PI);
      out.coreAdd=env*0.55; out.ampAdd=env*0.15; out.ringAdd=env*0.10;
      const surge = elasticSurge(p)*0.12*surgeAmt;
      out.coreAdd += Math.max(0,surge);
      return out;
    }
    return out;
  }

  // effect names that should also trigger a discrete, rate-limited sound —
  // maps 1:1 onto playModelSound's kinds; anything not listed stays silent
  const SOUND_FOR_EFFECT = {
    decision:"decision", lanux:"receive", ack:"ack",
    complete:"complete", warning:"warning", notice:"notice", think:"working"
  };

  function triggerWordOn(entity, name){
    entity.effect = { name:name, start:performance.now(), duration:EFFECT_DURATIONS[name]||1200 };
    const soundKind = SOUND_FOR_EFFECT[name];
    if (soundKind) playModelSound(entity, soundKind);
  }

  function triggerWarning(entityId){
    const e = entities[entityId];
    triggerWordOn(e, "warning");
    e.tintDuration = EFFECT_DURATIONS.warning;
    e.tintUntil = performance.now() + e.tintDuration;
    if (entityId === "s5"){
      systemPulses.push({ x:e.cur.x, y:e.cur.y, start:performance.now(), duration:1500 });
      MODEL_ORDER.forEach(function(id){
        if (id==="s5") return;
        entities[id].tintDuration = 1100;
        entities[id].tintUntil = Math.max(entities[id].tintUntil, performance.now()+1100);
      });
    }
  }

  /* =================================================================
     BASE AMPLITUDE
  ================================================================= */
  function baseAmplitude(mode, t, seedA, seedB, variant){
    let base;
    if (mode==="listen"){
      const n=0.5*Math.sin(t*2.1+seedA)+0.30*Math.sin(t*3.7+seedB*1.3)+0.20*Math.sin(t*5.9+seedA*0.6);
      base = clamp(0.42+n*0.55, 0.08, 1.15);
    } else if (mode==="speak"){
      const n=0.55*Math.sin(t*1.7+seedB)+0.30*Math.sin(t*3.1+seedA*0.8)+0.15*Math.sin(t*0.9+seedB*1.6);
      base = clamp(0.40+n*0.48, 0.08, 1.05);
    } else {
      base = 0.14+0.05*Math.sin(t*0.55+seedA)+0.02*Math.sin(t*1.3+seedB);
    }
    if (variant.pulseFreq){
      base += Math.max(0, Math.sin(t*variant.pulseFreq*2*Math.PI + seedA)) * 0.09;
    }
    return base;
  }

  /* =================================================================
     LAYOUT — command-center composition, measured directly from the
     supplied ui.zip reference (both sidebar-open and sidebar-minimized
     states). Each of the 5 slots per side has its own fixed (dx,dy)
     offset expressed as a factor of the sphere's own radius, mirrored
     left/right — this reproduces the reference's exact "flower" stagger
     rather than a rigid grid or a circular orbit. The composition's
     horizontal center AND its sphere radius are both derived from the
     actual space available (viewport minus the sidebar, when open),
     rather than a fixed fraction of one specific reference resolution —
     this is what keeps it from overflowing at narrower aspect ratios.
  ================================================================= */
  const SPHERE_R_FACTOR = 0.225;   // sphere radius = this * min(W,H), when there's room
  const SPEC_R_RATIO    = 0.257;   // specialist radius, relative to sphere radius
  // 5 slot offsets per side, top to bottom, as (dx,dy) factors of sphereR —
  // measured from the reference image (outer rows pulled in vertically-
  // dominant, the second row pushed out furthest, middle row purely horizontal)
  const SIDE_OFFSETS = [
    { dx:1.647, dy:-1.149 },
    { dx:2.687, dy:-0.871 },
    { dx:2.012, dy: 0     },
    { dx:2.687, dy: 0.871 },
    { dx:1.647, dy: 1.149 },
  ];
  const MAX_DX = 2.687; // the furthest any slot reaches horizontally, x sphereR
  const SIDE_MARGIN = 24; // minimum breathing room from any edge/sidebar, px

  let layoutMeta = { centerX:0, centerY:0, sphereR:0 };
  let sidebarOpen = true;

  function computeLayout(){
    const W = mainCanvas.clientWidth, H = mainCanvas.clientHeight;
    const m = Math.min(W,H);
    const centerY = H*0.5;

    // right boundary of usable space — mirrors the sidebar's actual CSS
    // geometry (min(300px, 20vw), docked 22px from the right edge)
    const sidebarWidth = Math.min(300, 0.20*W);
    const rightBound = sidebarOpen ? (W - 22 - sidebarWidth - SIDE_MARGIN) : (W - SIDE_MARGIN);
    const availableWidth = Math.max(200, rightBound - SIDE_MARGIN);
    const centerX = SIDE_MARGIN + availableWidth/2;

    // sphere radius is the smaller of "as big as the reference wants" and
    // "as big as the available width actually allows" — this is what
    // guarantees no overflow at any aspect ratio or sidebar state
    const halfWidthNeeded = MAX_DX + SPEC_R_RATIO; // x sphereR
    const sphereRByHeight = m*SPHERE_R_FACTOR;
    const sphereRByWidth = (availableWidth/2) / halfWidthNeeded;
    const sphereR = Math.min(sphereRByHeight, sphereRByWidth);
    const specR = sphereR*SPEC_R_RATIO;

    entities[activeMain].target = { x:centerX, y:centerY, r:sphereR };

    const slots = getSlotAssignment();
    for (let i=0;i<5;i++){
      const off = SIDE_OFFSETS[i];
      entities[slots["left"+i]].target  = { x:centerX - off.dx*sphereR, y:centerY + off.dy*sphereR, r:specR };
      entities[slots["right"+i]].target = { x:centerX + off.dx*sphereR, y:centerY + off.dy*sphereR, r:specR };
    }

    layoutMeta = { centerX:centerX, centerY:centerY, sphereR:sphereR };
  }

  function setSidebarOpen(open){
    sidebarOpen = open;
    sidebarEl.classList.toggle("minimized", !open);
    sidebarToggleEl.classList.toggle("is-open", open);
    sidebarToggleIconEl.textContent = open ? "›" : "‹";
    computeLayout();
  }

  // positions the "current model" header and the central status pill —
  // both are pinned to the CENTER sphere's live (eased) position/size
  // each frame, so they glide smoothly along with it during transitions
  function syncHeaderAndStatus(){
    const c = entities[activeMain].cur;
    topLabelEl.style.left = c.x + "px";
    topLabelEl.style.top = (c.y - c.r - c.r*0.25 - 8) + "px";
    statusBarEl.style.left = c.x + "px";
    statusBarEl.style.top = (c.y + c.r + c.r*0.08 + 6) + "px";
    statusBarEl.style.width = (c.r*1.5) + "px";
  }

  function setActiveMain(id){
    if (activeMain === id) return;
    activeMain = id;
    computeLayout();
    updateTopLabel();
    playModelSound(entities[id], "select");
  }

  function updateTopLabel(){
    const e = entities[activeMain];
    headerNameEl.textContent = e.name;
    headerPurposeEl.textContent = e.purpose;
  }

  function statusWordFor(entity){
    if (entity.taskState === "receiving") return "RECEIVING";
    if (entity.taskState === "working") return "WORKING";
    if (entity.taskState === "returning") return "RETURNING";
    if (entity.taskState === "complete") return "COMPLETE";
    if (entity.effect && entity.effect.name === "think") return "THINKING";
    if (entity.mode === "listen") return "LISTENING";
    if (entity.mode === "speak") return "SPEAKING";
    return "IDLE";
  }

  /* =================================================================
     ACTIVITY FEED (top-left) — a live one-message-at-a-time queue,
     not a stacked log. Each message fades in, holds briefly, fades
     out, then the next queued message takes its place.
  ================================================================= */
  const feedBody = document.getElementById("feedBody");
  const workBody = document.getElementById("workBody");
  const historyBody = document.getElementById("historyBody");
  const feedQueue = [];
  const completedLog = [];
  let feedBusy = false;
  const FEED_HOLD_MS = 1750;   // ~1.5-2s on screen
  const FEED_FADE_MS = 420;

  function logMessage(speaker, text){
    feedQueue.push({ speaker:speaker, text:text });
    processFeedQueue();
  }

  function processFeedQueue(){
    if (feedBusy || feedQueue.length===0) return;
    feedBusy = true;
    const msg = feedQueue.shift();
    feedBody.innerHTML = '<div class="feed-msg" id="feedMsgNow"><span class="feed-speaker">'+msg.speaker+'</span><span class="feed-text">'+msg.text+'</span></div>';
    requestAnimationFrame(function(){
      const el = document.getElementById("feedMsgNow");
      if (el) el.classList.add("visible");
    });
    setTimeout(function(){
      const el = document.getElementById("feedMsgNow");
      if (el) el.classList.remove("visible");
      setTimeout(function(){
        feedBusy = false;
        processFeedQueue();
      }, FEED_FADE_MS);
    }, FEED_HOLD_MS);
  }

  function workStatusLabel(state){
    if (state==="receiving") return "WAITING";
    if (state==="working") return "WORKING";
    if (state==="returning") return "WORKING";
    if (state==="complete") return "COMPLETE";
    return "";
  }
  function workStatusClass(state){
    if (state==="receiving") return "waiting";
    if (state==="working"||state==="returning") return "working";
    return "complete";
  }

  function renderWorkPanel(){
    const specialists = MODEL_ORDER.filter(function(id){ return id!=="s5"; });
    const active = specialists.filter(function(id){ return entities[id].taskState!=="idle"; });
    let html = "";
    if (active.length===0){
