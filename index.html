<!--
  LANUX BRAIN — VISUAL PROTOTYPE (v3)
  ------------------------------------
  Standalone visual concept for LANUX's MAIN VOICE CONVERSATION INTERFACE:
  S5 (the controller) plus six specialist models (Coder, Researcher,
  Planner, Tester, Computer/Automation, Git/Project Ops).

  Builds directly on the V2 sphere technology (Fibonacci particle field,
  layered projection, orbital rings, luminous core, per-model movement
  variants, effect envelopes, delegation streams) and refines it into a
  more professional composition:
    - a spacious "command center" layout — S5 has deliberate negative
      space around it, specialists orbit further out, no permanent
      connector lines (only dynamic communication streams)
    - every sphere has a persistent, subtle name label beneath it
    - a top "internal activity" panel showing live communication between
      the user, S5, and the specialists (not a chat box — an activity feed)
    - a bottom-right "active work" panel showing each specialist's current
      task and status (WAITING / WORKING / COMPLETE), with a short history
    - model-to-model ("peer") communication streams in addition to the
      existing S5 <-> specialist streams
    - a scripted "run full demo" control that plays out an entire
      delegate -> work -> peer-communication -> complete -> acknowledge
      workflow end to end
    - the bottom-left mini brain always mirrors S5/LANUX itself (LANUX's
      persistent presence), reacting to delegation, warnings, completion,
      and voice activity regardless of which model is currently focused

  Pure HTML + CSS + vanilla JS. No frameworks, no external assets.
  No microphone, no speech recognition, no TTS, no backend, no real
  model inference, no auth — every model "doing work" or "talking" is a
  visual simulation only. This file is fully self-contained and does not
  touch any other LANUX project file.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LANUX — Voice Interface Concept (v3)</title>
<style>
  :root{
    --c1:#ABBED3;
    --c2:#B0BFD1;
    --c3:#B9C3D0;
    --c4:#CFDEEA;
    --bg:#0B0E14;      /* primary background — official LANUX foundation */
    --bg2:#0E1219;     /* secondary background */
    --surface:#131824; /* surface (panels) */
    --elevated:#1A2130;/* elevated surface (buttons, chips) */
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at 50% 42%, rgba(180,196,214,0.05) 0%, rgba(11,14,20,0) 55%),
               radial-gradient(ellipse at 50% 50%, rgba(11,14,20,0) 0%, rgba(6,7,11,0.6) 100%);
  }

  #stage{ position:fixed; inset:0; }

  canvas#main{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #overlay{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:7;
  }

  .model-hit{
    position:absolute;
    left:0; top:0;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:auto;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .model-label{
    position:relative;
    top:10px;
    text-align:center;
    color:var(--c3);
    opacity:0.42;
    transform:translateY(0);
    transition:opacity .35s ease, color .35s ease, transform .35s ease;
    text-shadow:0 0 10px rgba(207,222,234,0.18);
  }
  .model-name-text{
    display:block;
    font-size:10px;
    letter-spacing:0.22em;
    white-space:nowrap;
  }
  /* names sit quietly beneath every sphere at all times; hover/focus just
     brings them forward rather than toggling visibility on/off */
  .model-hit.show-label .model-label{ opacity:0.94; color:var(--c4); transform:translateY(-1px); text-shadow:0 0 14px rgba(207,222,234,0.4); }
  .model-hit.is-main .model-label{ opacity:0.96; color:var(--c4); }
  .model-hit.is-main .model-name-text{ font-size:12.5px; }

  .model-purpose{
    display:block;
    font-size:7.5px;
    letter-spacing:0.09em;
    color:var(--c3);
    opacity:0.55;
    margin:3px auto 0;
    max-width:132px;
    line-height:1.3;
    white-space:normal;
  }

  .model-task{
    position:absolute;
    top:calc(100% + 14px);
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    letter-spacing:0.02em;
    color:var(--c3);
    background:rgba(19,24,36,0.55);
    border:1px solid rgba(207,222,234,0.10);
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
    opacity:0;
    transition:opacity .3s ease;
    backdrop-filter:blur(6px);
  }
  .model-task.show{ opacity:0.92; }
  .model-task .status{
    color:var(--c4);
    letter-spacing:0.14em;
    margin-right:6px;
    opacity:0.8;
  }

  #topLabel{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    color:var(--c3);
    font-size:10px;
    letter-spacing:0.34em;
    opacity:0.38;
    z-index:10;
    user-select:none;
    pointer-events:none;
    text-align:center;
  }
  #topLabel .sub{ display:block; font-size:8px; letter-spacing:0.24em; opacity:0.65; margin-top:4px; }

  /* ---------------- internal activity feed (top-left) ---------------- */
  #feedPanel{
    position:fixed; top:70px; left:24px;
    width:min(300px, 30vw);
    min-height:74px;
    background:linear-gradient(180deg, rgba(19,24,36,0.58), rgba(14,18,25,0.38));
    border:1px solid rgba(207,222,234,0.09);
    border-radius:16px;
    padding:11px 16px 13px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    z-index:9; pointer-events:none;
    box-shadow:0 12px 40px rgba(0,0,0,0.22);
  }
  .panel-caption{
    font-size:8px; letter-spacing:0.28em; color:var(--c3); opacity:0.42;
    margin-bottom:8px;
  }
  #feedBody{ min-height:34px; }
  .feed-msg{ font-size:11px; line-height:1.45; opacity:0; transition:opacity .45s ease; }
  .feed-msg.visible{ opacity:1; }
  .feed-speaker{ display:block; color:var(--c4); letter-spacing:0.06em; font-weight:600; opacity:0.92; margin-bottom:2px; }
  .feed-text{ color:var(--c3); opacity:0.82; }

  /* ---------------- active work panel (top-right) ---------------- */
  #workPanel{
    position:fixed; top:70px; right:24px; width:min(300px, 30vw);
    max-height:230px; overflow:hidden;
    background:linear-gradient(180deg, rgba(19,24,36,0.58), rgba(14,18,25,0.38));
    border:1px solid rgba(207,222,234,0.09);
    border-radius:16px;
    padding:11px 16px 13px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    z-index:9; pointer-events:none;
    box-shadow:0 12px 40px rgba(0,0,0,0.22);
  }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .work-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid rgba(207,222,234,0.06); animation:rowIn .4s ease; }
  .work-row:last-child{ border-bottom:none; }
  .work-main{ min-width:0; }
  .work-model{ font-size:10px; letter-spacing:0.1em; color:var(--c4); opacity:0.92; }
  .work-task{ display:block; font-size:9.5px; color:var(--c3); opacity:0.7; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
  .work-status{ flex:none; font-size:8px; letter-spacing:0.14em; padding:2px 8px; border-radius:999px; border:1px solid rgba(207,222,234,0.16); white-space:nowrap; opacity:0.85; }
  .work-status.working{ color:var(--c4); border-color:rgba(207,222,234,0.32); }
  .work-status.waiting{ color:var(--c3); opacity:0.55; }
  .work-status.complete{ color:var(--c3); opacity:0.4; border-color:rgba(207,222,234,0.08); }
  .work-empty{ font-size:10px; color:var(--c3); opacity:0.35; }
  .work-more{ font-size:9px; color:var(--c3); opacity:0.4; padding:5px 0 0; }
  .work-section-label{ font-size:7.5px; letter-spacing:0.22em; color:var(--c3); opacity:0.32; margin:10px 0 4px; }

  #controls{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:7px;
    max-width:94vw; z-index:10;
  }
  .control-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
  }
  .row-caption{
    font-size:8px; letter-spacing:0.26em; color:var(--c3); opacity:0.36;
    margin-bottom:-2px;
  }
  #controls .divider{
    width:1px; align-self:stretch; background:rgba(207,222,234,0.12); margin:2px 4px;
  }

  button.lx-btn{
    appearance:none;
    border:1px solid rgba(207,222,234,0.13);
    background:rgba(26,33,48,0.45);
    color:var(--c4);
    font-size:10px;
    letter-spacing:0.06em;
    padding:6px 11px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .25s ease, border-color .25s ease, transform .15s ease, opacity .25s ease;
    opacity:0.68;
  }
  button.lx-btn:hover{ opacity:1; background:rgba(207,222,234,0.09); border-color:rgba(207,222,234,0.32); }
  button.lx-btn:active{ transform:scale(0.94); }
  button.lx-btn.state-btn.is-active{ opacity:1; background:rgba(207,222,234,0.14); border-color:rgba(207,222,234,0.45); }
  button.lx-btn.warn-btn{ border-color:rgba(196,150,145,0.22); }
  button.lx-btn.warn-btn:hover{ background:rgba(196,150,145,0.12); border-color:rgba(196,150,145,0.4); }
  button.lx-btn.deleg-btn{ font-size:9px; }
  button.lx-btn.demo-btn{
    font-size:10px; letter-spacing:0.12em;
    border-color:rgba(207,222,234,0.28);
    background:rgba(207,222,234,0.07);
    opacity:0.88;
  }
  button.lx-btn.demo-btn:hover{ background:rgba(207,222,234,0.14); border-color:rgba(207,222,234,0.5); }

  .mini-ring{
    position:fixed; left:22px; bottom:22px; width:56px; height:56px;
    border-radius:50%; border:1px solid rgba(207,222,234,0.08);
    pointer-events:none; z-index:6;
  }
  canvas#mini{
    position:fixed; left:22px; bottom:22px; width:56px; height:56px;
    display:block; pointer-events:none;
    filter:drop-shadow(0 0 10px rgba(171,190,211,0.18));
    z-index:6;
  }
  #miniLabel{
    position:fixed; left:22px; bottom:82px;
    font-size:8.5px; letter-spacing:0.2em; color:var(--c3); opacity:0.45;
    z-index:6; pointer-events:none;
  }

  @media (max-width:1000px){
    #feedPanel, #workPanel{ width:220px; }
  }
  @media (max-width:820px){
    #feedPanel, #workPanel{ display:none; }
  }
  @media (max-width:760px){
    button.lx-btn{ padding:6px 9px; font-size:9px; }
    .model-task{ font-size:9px; padding:3px 8px; }
  }
</style>
</head>
<body>

<div id="topLabel">LANUX<span class="sub" id="topSub">S5 — CENTRAL CONTROLLER</span></div>

<div id="feedPanel">
  <div class="panel-caption">INTERNAL ACTIVITY</div>
  <div id="feedBody"></div>
</div>

<div id="stage">
  <canvas id="main"></canvas>
  <div id="overlay"></div>
</div>

<div id="workPanel">
  <div class="panel-caption">ACTIVE WORK</div>
  <div id="workBody"></div>
</div>

<div class="mini-ring"></div>
<canvas id="mini"></canvas>
<div id="miniLabel">LANUX PRESENT</div>

<div id="controls">
  <div class="row-caption">VOICE / REACTIONS</div>
  <div class="control-row">
    <button class="lx-btn state-btn" data-mode="idle">IDLE</button>
    <button class="lx-btn state-btn" data-mode="listen">LISTEN</button>
    <button class="lx-btn state-btn" data-mode="speak">SPEAK</button>
    <div class="divider"></div>
    <button class="lx-btn word-btn" data-word="lanux">LANUX</button>
    <button class="lx-btn word-btn" data-word="think">THINK</button>
    <button class="lx-btn word-btn" data-word="search">SEARCH</button>
    <button class="lx-btn word-btn" data-word="code">CODE</button>
    <button class="lx-btn word-btn warn-btn" data-word="warning">WARNING</button>
  </div>
  <div class="row-caption">DELEGATE FROM S5</div>
  <div class="control-row">
    <button class="lx-btn deleg-btn" data-deleg="coder">→ CODER</button>
    <button class="lx-btn deleg-btn" data-deleg="researcher">→ RESEARCHER</button>
    <button class="lx-btn deleg-btn" data-deleg="planner">→ PLANNER</button>
    <button class="lx-btn deleg-btn" data-deleg="tester">→ TESTER</button>
    <button class="lx-btn deleg-btn" data-deleg="computer">→ COMPUTER</button>
    <button class="lx-btn deleg-btn" data-deleg="git">→ GIT</button>
    <div class="divider"></div>
    <button class="lx-btn deleg-btn" data-deleg="all">→ ALL</button>
    <div class="divider"></div>
    <button class="lx-btn demo-btn" id="demoBtn">▶ RUN FULL DEMO</button>
  </div>
</div>


<script>
(function(){
  "use strict";

  /* =================================================================
     PALETTE & MATH HELPERS
  ================================================================= */
  const PALETTE = {
    c1:{r:0xAB,g:0xBE,b:0xD3},
    c2:{r:0xB0,g:0xBF,b:0xD1},
    c3:{r:0xB9,g:0xC3,b:0xD0},
    c4:{r:0xCF,g:0xDE,b:0xEA},
  };
  const WARN_TINT = {r:196,g:148,b:138}; // subtle warm rose — "requires attention", never bright red

  function rgba(c,a){ return "rgba("+Math.round(c.r)+","+Math.round(c.g)+","+Math.round(c.b)+","+a+")"; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function mixColor(c1,c2,t){ return {r:lerp(c1.r,c2.r,t), g:lerp(c1.g,c2.g,t), b:lerp(c1.b,c2.b,t)}; }

  /* =================================================================
     MODEL DEFINITIONS
  ================================================================= */
  const MODEL_ORDER = ["s5","coder","researcher","planner","tester","computer","git"];
  const MODEL_META = {
    s5:         { name:"LANUX S5", purpose:"Controller / Decision Maker", role:"CONTROLLER",  variant:"controller",  particles:460 },
    coder:      { name:"CODER",       purpose:"Code / Implementation",       role:"SPECIALIST", variant:"structured",  particles:180 },
    researcher: { name:"RESEARCHER",  purpose:"Research / Information",      role:"SPECIALIST", variant:"flowing",     particles:180 },
    planner:    { name:"PLANNER",     purpose:"Planning / Strategy",         role:"SPECIALIST", variant:"orbital",     particles:180 },
    tester:     { name:"TESTER",      purpose:"Testing / Debugging",         role:"SPECIALIST", variant:"pulse",       particles:170 },
    computer:   { name:"COMPUTER",    purpose:"PC Control / Automation",     role:"SPECIALIST", variant:"mechanical",  particles:170 },
    git:        { name:"GIT / OPS",   purpose:"Git / Projects / Deployment", role:"SPECIALIST", variant:"branching",   particles:170 },
  };
  // fixed left/right command-center columns — never a circular orbit
  const SIDE_LAYOUT = {
    left:  ["coder","planner","computer"],
    right: ["researcher","tester","git"]
  };
  const TASKS = {
    coder:      "Modify authentication system",
    researcher: "Research OAuth requirements",
    planner:    "Plan sprint roadmap",
    tester:     "Test authentication flow",
    computer:   "Run automated build",
    git:        "Prepare repository changes",
  };
  const VARIANTS = {
    controller: { jitterMul:0.65, structuredBase:0,    ringCount:4, ringProminence:1.35, pulseFreq:0,   rotSpeed:0.050, asym:true,  extraShell:true },
    structured: { jitterMul:0.22, structuredBase:0.22, ringCount:3, ringProminence:0.85, pulseFreq:0,   rotSpeed:0.085, asym:false },
    flowing:    { jitterMul:1.45, structuredBase:0,    ringCount:2, ringProminence:0.70, pulseFreq:0,   rotSpeed:0.070, asym:false },
    orbital:    { jitterMul:0.45, structuredBase:0,    ringCount:4, ringProminence:1.45, pulseFreq:0,   rotSpeed:0.095, asym:false },
    pulse:      { jitterMul:0.55, structuredBase:0,    ringCount:3, ringProminence:0.95, pulseFreq:1.7, rotSpeed:0.100, asym:false },
    mechanical: { jitterMul:0.18, structuredBase:0.10, ringCount:3, ringProminence:1.00, pulseFreq:0,   rotSpeed:0.140, asym:false, sweep:true },
    branching:  { jitterMul:0.48, structuredBase:0.06, ringCount:3, ringProminence:1.00, pulseFreq:0,   rotSpeed:0.080, asym:false, branchBlink:true },
  };

  const EFFECT_DURATIONS = {
    lanux:700, think:1900, search:1600, code:1700, warning:2600,
    click:500, notice:380, decision:900, ack:600, complete:750
  };

  /* =================================================================
     PARTICLE FIELD (Fibonacci sphere)
  ================================================================= */
  function buildParticles(count){
    const arr = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i=0;i<count;i++){
      const yv = 1 - (i/(count-1))*2;
      const rAtY = Math.sqrt(Math.max(0,1-yv*yv));
      const theta = golden*i;
      const x = Math.cos(theta)*rAtY, z = Math.sin(theta)*rAtY, y = yv;
      arr.push({
        x0:x, y0:y, z0:z, theta:theta, phi:Math.acos(clamp(yv,-1,1)),
        seed1:Math.random()*Math.PI*2, seed2:Math.random()*Math.PI*2,
        freq1:0.5+Math.random()*0.6, freq2:0.3+Math.random()*0.5,
        distIndex:i/count, group:i%24
      });
    }
    return arr;
  }
  function structuredVector(p){
    const latSteps=9, lonSteps=14;
    const phiSnap = Math.round(p.phi/(Math.PI/latSteps))*(Math.PI/latSteps);
    const thetaSnap = Math.round(p.theta/(Math.PI*2/lonSteps))*(Math.PI*2/lonSteps);
    const sy=Math.cos(phiSnap), rAtY=Math.sin(phiSnap);
    return { x:Math.cos(thetaSnap)*rAtY, y:sy, z:Math.sin(thetaSnap)*rAtY };
  }

  /* =================================================================
     ENTITY MODEL
  ================================================================= */
  const entities = {};
  MODEL_ORDER.forEach(function(id){
    const meta = MODEL_META[id];
    const e = {
      id:id, name:meta.name, purpose:meta.purpose, role:meta.role, variant:VARIANTS[meta.variant],
      particles: buildParticles(meta.particles),
      cur:{x:0,y:0,r:10}, target:{x:0,y:0,r:10},
      hoverOffset:{x:0,y:0}, hoverBoost:0, hovered:false,
      mode:"idle", effect:null,
      taskState:"idle", taskText:"", workUntil:0,
      tintUntil:0, tintDuration:0,
      smoothedAmp: id==="s5" ? 0.16 : 0.12,
      seedA:Math.random()*1000, seedB:Math.random()*1000, seedC:Math.random()*1000,
      branchAt:0, branchGroup:0
    };
    if (id==="s5"){
      e.innerParticles = e.particles.filter(function(_,i){ return i%2===0; });
    }
    entities[id] = e;
  });

  let activeMain = "s5";
  const streams = [];       // delegation energy streams
  const systemPulses = [];  // authoritative system-wide warning rings

  /* =================================================================
     EFFECT ENVELOPES
  ================================================================= */
  function effectParams(name, p){
    const out = { ampAdd:0, coreAdd:0, ringAdd:0, structured:0, spiral:0, ripple:0, ripplePhase:0, rotBoost:0, flash:0, tint:0 };

    if (name==="lanux" || name==="complete"){
      const e = Math.exp(-p*7.5);
      out.flash=e; out.coreAdd=e*0.9; out.ringAdd=Math.sin(p*Math.PI)*0.35; out.ampAdd=e*0.5;
      return out;
    }
    if (name==="think"){
      const inPhase=clamp(p/0.5,0,1), outPhase=clamp((p-0.5)/0.5,0,1);
      out.spiral=Math.sin(inPhase*Math.PI)*(1-outPhase*0.3);
      out.coreAdd=Math.sin(clamp(p/0.7,0,1)*Math.PI)*0.8;
      out.rotBoost=(1-p)*1.8;
      out.ampAdd=-0.05*(1-outPhase)+outPhase*0.15;
      return out;
    }
    if (name==="search"){
      out.ripple=Math.sin(p*Math.PI); out.ripplePhase=p;
      out.coreAdd=0.25*(1-p); out.ampAdd=0.1*Math.sin(p*Math.PI);
      return out;
    }
    if (name==="code"){
      out.structured=Math.sin(p*Math.PI);
      const pulses=Math.sin(p*Math.PI*9);
      out.ampAdd=Math.max(0,pulses)*0.28*(1-p*0.4);
      out.coreAdd=Math.max(0,pulses)*0.35;
      out.ringAdd=0.06*Math.max(0,pulses);
      return out;
    }
    if (name==="warning"){
      const warmth=Math.sin(p*Math.PI);
      const cyc=Math.sin(p*Math.PI*3)*(1-p*0.3);
      out.ampAdd=cyc*0.5; out.coreAdd=Math.max(0,cyc)*0.6+warmth*0.15;
      out.ringAdd=cyc*0.24; out.flash=Math.max(0,-cyc)*0.25;
      out.tint=warmth;
      return out;
    }
    if (name==="click"){
      const e=Math.exp(-p*9);
      out.ampAdd=e*0.3; out.coreAdd=e*0.5; out.ringAdd=Math.sin(p*Math.PI)*0.15;
      return out;
    }
    if (name==="notice"){
      const e=Math.exp(-p*10);
      out.flash=e*0.35; out.coreAdd=e*0.25; out.ampAdd=e*0.15;
      return out;
    }
    if (name==="decision"){
      const env=Math.sin(p*Math.PI);
      out.coreAdd=env*1.0; out.ringAdd=-0.12*env+0.05*Math.sin(p*Math.PI*2);
      out.ampAdd=env*0.25; out.flash=env*0.15;
      return out;
    }
    if (name==="ack"){
      const env=Math.sin(p*Math.PI);
      out.coreAdd=env*0.55; out.ampAdd=env*0.15; out.ringAdd=env*0.10;
      return out;
    }
    return out;
  }

  function triggerWordOn(entity, name){
    entity.effect = { name:name, start:performance.now(), duration:EFFECT_DURATIONS[name]||1200 };
  }

  function triggerWarning(entityId){
    const e = entities[entityId];
    triggerWordOn(e, "warning");
    e.tintDuration = EFFECT_DURATIONS.warning;
    e.tintUntil = performance.now() + e.tintDuration;
    if (entityId === "s5"){
      systemPulses.push({ x:e.cur.x, y:e.cur.y, start:performance.now(), duration:1500 });
      MODEL_ORDER.forEach(function(id){
        if (id==="s5") return;
        entities[id].tintDuration = 1100;
        entities[id].tintUntil = Math.max(entities[id].tintUntil, performance.now()+1100);
      });
    }
  }

  /* =================================================================
     BASE AMPLITUDE
  ================================================================= */
  function baseAmplitude(mode, t, seedA, seedB, variant){
    let base;
    if (mode==="listen"){
      const n=0.5*Math.sin(t*2.1+seedA)+0.30*Math.sin(t*3.7+seedB*1.3)+0.20*Math.sin(t*5.9+seedA*0.6);
      base = clamp(0.42+n*0.55, 0.08, 1.15);
    } else if (mode==="speak"){
      const n=0.55*Math.sin(t*1.7+seedB)+0.30*Math.sin(t*3.1+seedA*0.8)+0.15*Math.sin(t*0.9+seedB*1.6);
      base = clamp(0.40+n*0.48, 0.08, 1.05);
    } else {
      base = 0.14+0.05*Math.sin(t*0.55+seedA)+0.02*Math.sin(t*1.3+seedB);
    }
    if (variant.pulseFreq){
      base += Math.max(0, Math.sin(t*variant.pulseFreq*2*Math.PI + seedA)) * 0.09;
    }
    return base;
  }

  /* =================================================================
     LAYOUT — command-center composition
     S5 is large and centered with deliberate negative space. The six
     specialists sit ONLY in two fixed vertical columns (left / right) —
     never a ring, never above/below S5. Positions are derived from the
     live viewport size (reserved top/bottom bands + a responsive column
     gap) so the composition holds together across desktop sizes rather
     than relying on fixed pixel coordinates.
  ================================================================= */
  const TOP_RESERVED = 230;    // clears the top-left/top-right info panels
  const BOTTOM_RESERVED = 190; // clears the control bar + mini brain row

  function layoutColumn(ids, colX, centerY, vSpacing, m, specR){
    const n = ids.length;
    ids.forEach(function(id, idx){
      const offsetSteps = idx - (n-1)/2;
      const wobble = 1 + 0.035*Math.sin(idx*2.1 + colX*0.001); // subtle, never rigid
      entities[id].target = {
        x: colX,
        y: centerY + offsetSteps*vSpacing*wobble,
        r: specR
      };
    });
  }

  function computeLayout(){
    const W = mainCanvas.clientWidth, H = mainCanvas.clientHeight;
    const m = Math.min(W,H);
    const middleH = Math.max(260, H - TOP_RESERVED - BOTTOM_RESERVED);
    const centerY = TOP_RESERVED + middleH/2;
    const vSpacing = Math.min(middleH*0.30, 140);
    const colGap = Math.min(W*0.33, Math.max(200, W/2 - 130));
    const leftX = W*0.5 - colGap;
    const rightX = W*0.5 + colGap;
    const specR = m*0.058;

    if (activeMain === "s5"){
      const r = Math.min(m*0.20, middleH*0.42);
      entities.s5.target = { x:W*0.5, y:centerY, r:r };
      layoutColumn(SIDE_LAYOUT.left, leftX, centerY, vSpacing, m, specR);
      layoutColumn(SIDE_LAYOUT.right, rightX, centerY, vSpacing, m, specR);
    } else {
      const mainId = activeMain;
      const r = Math.min(m*0.185, middleH*0.40);
      entities[mainId].target = { x:W*0.5, y:centerY, r:r };
      entities.s5.target = { x:W*0.5, y:TOP_RESERVED*0.55, r:m*0.035 };
      const leftIds = SIDE_LAYOUT.left.filter(function(id){ return id!==mainId; });
      const rightIds = SIDE_LAYOUT.right.filter(function(id){ return id!==mainId; });
      layoutColumn(leftIds, leftX, centerY, vSpacing, m, specR);
      layoutColumn(rightIds, rightX, centerY, vSpacing, m, specR);
    }
  }

  function setActiveMain(id){
    if (activeMain === id) return;
    activeMain = id;
    computeLayout();
    updateTopLabel();
  }

  function updateTopLabel(){
    const e = entities[activeMain];
    topSub.textContent = activeMain==="s5" ? "S5 — CENTRAL CONTROLLER" : e.name + " — ACTIVE MODEL";
  }

  /* =================================================================
     ACTIVITY FEED (top-left) — a live one-message-at-a-time queue,
     not a stacked log. Each message fades in, holds briefly, fades
     out, then the next queued message takes its place.
  ================================================================= */
  const feedBody = document.getElementById("feedBody");
  const workBody = document.getElementById("workBody");
  const feedQueue = [];
  const completedLog = [];
  let feedBusy = false;
  const FEED_HOLD_MS = 1750;   // ~1.5-2s on screen
  const FEED_FADE_MS = 420;

  function logMessage(speaker, text){
    feedQueue.push({ speaker:speaker, text:text });
    processFeedQueue();
  }

  function processFeedQueue(){
    if (feedBusy || feedQueue.length===0) return;
    feedBusy = true;
    const msg = feedQueue.shift();
    feedBody.innerHTML = '<div class="feed-msg" id="feedMsgNow"><span class="feed-speaker">'+msg.speaker+'</span><span class="feed-text">'+msg.text+'</span></div>';
    requestAnimationFrame(function(){
      const el = document.getElementById("feedMsgNow");
      if (el) el.classList.add("visible");
    });
    setTimeout(function(){
      const el = document.getElementById("feedMsgNow");
      if (el) el.classList.remove("visible");
      setTimeout(function(){
        feedBusy = false;
        processFeedQueue();
      }, FEED_FADE_MS);
    }, FEED_HOLD_MS);
  }

  function workStatusLabel(state){
    if (state==="receiving") return "WAITING";
    if (state==="working") return "WORKING";
    if (state==="returning") return "WORKING";
    if (state==="complete") return "COMPLETE";
    return "";
  }
  function workStatusClass(state){
    if (state==="receiving") return "waiting";
    if (state==="working"||state==="returning") return "working";
    return "complete";
  }

  function renderWorkPanel(){
    const specialists = MODEL_ORDER.filter(function(id){ return id!=="s5"; });
    const active = specialists.filter(function(id){ return entities[id].taskState!=="idle"; });
    let html = "";
    if (active.length===0 && completedLog.length===0){
      html = '<div class="work-empty">No active tasks. Delegate work from S5 to see it here.</div>';
    } else {
      const shown = active.slice(0,3); // current work stays the priority — never a giant list
      shown.forEach(function(id){
        const e = entities[id];
        html += '<div class="work-row"><div class="work-main"><div class="work-model">'+e.name+'</div>'
              + '<span class="work-task">'+ (e.taskText||"") +'</span></div>'
              + '<div class="work-status '+workStatusClass(e.taskState)+'">'+workStatusLabel(e.taskState)+'</div></div>';
      });
      if (active.length > shown.length){
        html += '<div class="work-more">+'+(active.length-shown.length)+' more working…</div>';
      }
      if (completedLog.length){
        html += '<div class="work-section-label">HISTORY</div>';
        completedLog.slice(-1).reverse().forEach(function(item){
          html += '<div class="work-row"><div class="work-main"><div class="work-model">'+item.model+'</div>'
                + '<span class="work-task">'+item.task+'</span></div>'
                + '<div class="work-status complete">COMPLETE</div></div>';
        });
      }
    }
    if (workBody._sig !== html){
      workBody.innerHTML = html;
      workBody._sig = html;
    }
  }

  /* =================================================================
     DELEGATION
  ================================================================= */
  function spawnStream(fromId, toId, kind, taskText, workDuration){
    streams.push({
      fromId:fromId, toId:toId, kind:kind,
      start:performance.now(), duration: 900,
      taskText: taskText || "", workDuration: workDuration || 4200
    });
  }

  function delegate(ids, overrideTasks, overrideDuration){
    const s5 = entities.s5;
    triggerWordOn(s5, "decision");
    logMessage("LANUX-S5", ids.length>1
      ? "Assigning work across " + ids.length + " specialists."
      : "Assigning a task to " + entities[ids[0]].name + ".");
    ids.forEach(function(id, idx){
      setTimeout(function(){
        const text = (overrideTasks && overrideTasks[id]) || TASKS[id];
        entities[id].taskState = "receiving";
        spawnStream("s5", id, "out", text, overrideDuration);
        logMessage("S5 → " + entities[id].name.toUpperCase(), text);
      }, 450 + idx*160);
    });
  }

  function forceComplete(modelId, customMsg){
    const e = entities[modelId];
    if (e.taskState === "idle" || e.taskState === "complete") return;
    e._pendingCompleteMsg = customMsg || null;
    e.taskState = "returning";
    spawnStream(modelId, "s5", "return");
  }


  function handleStreamArrival(s){
    if (s.kind === "peer"){
      triggerWordOn(entities[s.toId], "notice");
      return;
    }
    if (s.kind === "out"){
      const target = entities[s.toId];
      target.taskState = "receiving";
      target.taskText = s.taskText;
      triggerWordOn(target, "lanux");
      target.workUntil = performance.now() + s.workDuration;
      setTimeout(function(){
        if (target.taskState === "receiving") target.taskState = "working";
      }, 350);
    } else {
      const src = entities[s.fromId];
      const doneTask = src.taskText;
      const msgText = src._pendingCompleteMsg || (doneTask ? doneTask + " — complete." : "Task complete.");
      triggerWordOn(entities.s5, "ack");
      src.taskState = "complete";
      triggerWordOn(src, "complete");
      logMessage(src.name.toUpperCase() + " → LANUX-S5", msgText);
      completedLog.push({ model:src.name, task: doneTask || msgText });
      src._pendingCompleteMsg = null;
      src.taskText = "";
      setTimeout(function(){
        if (src.taskState === "complete") src.taskState = "idle";
      }, 700);
    }
  }

  /* =================================================================
     RENDER — one shared function draws any sphere entity, at any
     canvas / center / radius. Used for all 7 main-canvas spheres AND
     for the bottom-left mini sphere (which mirrors whichever entity
     is currently active).
  ================================================================= */
  function drawSphereVisual(ctx, cx, cy, baseR, entity, opts){
    opts = opts || {};
    const t = performance.now()/1000;
    const now = performance.now();
    const variant = entity.variant;

    let fx = { ampAdd:0, coreAdd:0, ringAdd:0, structured:0, spiral:0, ripple:0, ripplePhase:0, rotBoost:0, flash:0, tint:0 };
    if (entity.effect){
      const p = clamp((now-entity.effect.start)/entity.effect.duration, 0, 1);
      fx = effectParams(entity.effect.name, p);
      if (p>=1) entity.effect=null;
    }

    const workingBoost = entity.taskState==="working" ? 0.22
      : (entity.taskState==="receiving"||entity.taskState==="returning") ? 0.12 : 0;

    const rawAmp = baseAmplitude(entity.mode, t, entity.seedA, entity.seedB, variant) + fx.ampAdd + workingBoost + (opts.hoverBoost||0)*0.10;
    entity.smoothedAmp = lerp(entity.smoothedAmp, rawAmp, 0.12);
    const amp = clamp(entity.smoothedAmp, 0, 1.35);

    const hoverScale = 1 + (entity.hoverBoost||0)*0.10;
    const breathe = (1 + amp*0.16) * hoverScale;
    const sphereR = baseR * breathe;

    const rotSpeed = variant.rotSpeed + fx.rotBoost*0.35 + (entity.mode!=="idle" ? 0.04 : 0);
    const rotY = t*rotSpeed + entity.seedC*0.001 + (opts.phaseOffset||0);
    let rotX = Math.sin(t*0.13 + entity.seedA*0.01) * 0.32;
    if (variant.asym) rotX += Math.sin(t*0.31 + entity.seedB*0.01) * 0.13;

    const cosY=Math.cos(rotY), sinY=Math.sin(rotY), cosX=Math.cos(rotX), sinX=Math.sin(rotX);

    // tint blend (warning warmth)
    let tintAmount = 0;
    if (entity.tintUntil && now < entity.tintUntil && entity.tintDuration){
      tintAmount = clamp((entity.tintUntil-now)/entity.tintDuration, 0, 1);
    }
    tintAmount = Math.max(tintAmount, fx.tint*0.6);
    const c1 = tintAmount>0.001 ? mixColor(PALETTE.c1, WARN_TINT, tintAmount*0.55) : PALETTE.c1;
    const c3 = tintAmount>0.001 ? mixColor(PALETTE.c3, WARN_TINT, tintAmount*0.5) : PALETTE.c3;
    const c4 = tintAmount>0.001 ? mixColor(PALETTE.c4, WARN_TINT, tintAmount*0.4) : PALETTE.c4;

    // outer glow
    const glowFlicker = 0.85 + 0.15*Math.sin(t*3.2+entity.seedC)*(0.4+amp);
    const outerGlowR = sphereR*(1.9+amp*0.4);
    const gGrad = ctx.createRadialGradient(cx,cy,sphereR*0.4, cx,cy,outerGlowR);
    gGrad.addColorStop(0, rgba(c1, 0.10*glowFlicker + fx.flash*0.15));
    gGrad.addColorStop(0.5, rgba(c3, 0.045*glowFlicker));
    gGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gGrad;
    ctx.beginPath(); ctx.arc(cx,cy,outerGlowR,0,Math.PI*2); ctx.fill();

    // rings
    const ringCount = variant.ringCount;
    for (let idx=0; idx<ringCount; idx++){
      const rMul = 1.12 + idx*0.12;
      const tiltBase = 0.15 + idx*0.22;
      const speed = 0.08 + idx*0.045;
      const dir = idx%2===0 ? 1 : -1;
      const ringR = sphereR * rMul * (1 + fx.ringAdd*0.5) * variant.ringProminence;
      const ringRotY = t*speed*dir + idx*1.7 + (opts.phaseOffset||0) + entity.seedB*0.001;
      const squash = 0.28 + 0.24*Math.sin(tiltBase + Math.sin(t*0.07+idx+entity.seedA*0.001));
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(ringRotY*0.15);
      ctx.scale(1, Math.max(0.10, Math.abs(squash)));
      ctx.beginPath(); ctx.arc(0,0,ringR,0,Math.PI*2);
      ctx.strokeStyle = rgba(c3, (0.12+idx*0.01) + fx.flash*0.2 + amp*0.05);
      ctx.lineWidth = Math.max(0.6, (opts.lineScale||1)*0.9);
      ctx.stroke();
      ctx.restore();
    }

    // mechanical "sweep" beam
    if (variant.sweep){
      const sweepAngle = t*1.15 + entity.seedA*0.01;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(sweepAngle);
      ctx.beginPath();
      ctx.arc(0,0, sphereR*1.2, -0.22, 0.22);
      ctx.strokeStyle = rgba(c4, 0.30 + fx.flash*0.2);
      ctx.lineWidth = Math.max(0.8,(opts.lineScale||1)*1.1);
      ctx.stroke();
      ctx.restore();
    }

    // branch blink window
    let branchWindow = -1;
    if (variant.branchBlink && entity.branchAt){
      const dt = now - entity.branchAt;
      if (dt>=0 && dt<300) branchWindow = 1 - dt/300;
    }

    function projectAndDraw(list, radiusMul, colorLean, sizeMul){
      const projected = [];
      for (let i=0;i<list.length;i++){
        const p = list[i];
        const drift = 1 + 0.05*variant.jitterMul*Math.sin(t*p.freq1+p.seed1)*(0.4+amp)
                        + 0.03*variant.jitterMul*Math.sin(t*p.freq2+p.seed2+i*0.01);

        let vx=p.x0, vy=p.y0, vz=p.z0;
        const structAmt = clamp(variant.structuredBase + fx.structured, 0, 1);
        if (structAmt > 0.001){
          const sv = structuredVector(p);
          vx = lerp(vx, sv.x, structAmt);
          vy = lerp(vy, sv.y, structAmt);
          vz = lerp(vz, sv.z, structAmt);
        }

        let radialScale = drift;
        if (fx.spiral>0.001) radialScale *= (1 - fx.spiral*0.45);
        if (fx.ripple>0.001){
          const wave = Math.sin((p.distIndex*10 - fx.ripplePhase*14));
          radialScale *= (1 + Math.max(0,wave)*fx.ripple*0.35);
        }
        radialScale *= (1 + amp*0.10);
        radialScale *= radiusMul;

        const rad = sphereR * radialScale;
        let rx = vx*cosY - vz*sinY;
        let rz = vx*sinY + vz*cosY;
        let ry = vy*cosX - rz*sinX;
        rz = vy*sinX + rz*cosX;

        const sx = cx + rx*rad, sy = cy + ry*rad;
        const depth = (rz+1)/2;
        let extraAlpha = 0;
        if (branchWindow>0 && p.group===entity.branchGroup) extraAlpha = 0.5*branchWindow;

        projected.push({sx:sx, sy:sy, depth:depth, extraAlpha:extraAlpha});
      }
      projected.sort(function(a,b){ return a.depth-b.depth; });
      for (let k=0;k<projected.length;k++){
        const pr = projected[k];
        const size = lerp(0.55,2.1,pr.depth) * (opts.particleScale||1) * sizeMul;
        const alpha = clamp((lerp(0.10,0.85,pr.depth)*(0.55+amp*0.5)) + pr.extraAlpha, 0, 1);
        const col = mixColor(colorLean===1?c1:c1, c4, pr.depth*0.7 + fx.flash*0.3);
        ctx.beginPath();
        ctx.fillStyle = rgba(col, alpha);
        ctx.arc(pr.sx, pr.sy, size, 0, Math.PI*2);
        ctx.fill();
      }
    }

    projectAndDraw(entity.particles, 1, 1, 1);
    if (variant.extraShell && entity.innerParticles){
      projectAndDraw(entity.innerParticles, 0.52, 1, 0.85);
    }

    // core
    const coreBrightness = clamp(0.55 + amp*0.5 + fx.coreAdd, 0, 1.7);
    const coreR = sphereR*(0.16+coreBrightness*0.05);
    const coreGrad = ctx.createRadialGradient(cx,cy,0, cx,cy, coreR*2.4);
    coreGrad.addColorStop(0, rgba(c4, clamp(0.95*coreBrightness,0,1)));
    coreGrad.addColorStop(0.35, rgba(c3, clamp(0.5*coreBrightness,0,1)));
    coreGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(cx,cy,coreR*2.4,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = rgba(c4, clamp(0.9*coreBrightness,0,1));
    ctx.arc(cx,cy,coreR*0.55,0,Math.PI*2); ctx.fill();
  }

  /* =================================================================
     STREAMS & SYSTEM PULSES (drawn on main canvas only)
  ================================================================= */
  function drawStreams(ctx){
    for (let i=streams.length-1;i>=0;i--){
      const s = streams[i];
      const p = clamp((performance.now()-s.start)/s.duration, 0, 1);
      const from = entities[s.fromId], to = entities[s.toId];
      const x0=from.cur.x, y0=from.cur.y, x1=to.cur.x, y1=to.cur.y;
      const mx=(x0+x1)/2, my=(y0+y1)/2 - Math.abs(x1-x0)*0.12 - 20;

      function bez(tt){
        const it=1-tt;
        return {
          x: it*it*x0 + 2*it*tt*mx + tt*tt*x1,
          y: it*it*y0 + 2*it*tt*my + tt*tt*y1
        };
      }

      // faint guide path
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.quadraticCurveTo(mx,my,x1,y1);
      ctx.strokeStyle = rgba(PALETTE.c3, 0.06);
      ctx.lineWidth = 1;
      ctx.stroke();

      // comet with trailing dots
      const trail = [0, -0.035, -0.07, -0.105];
      for (let k=0;k<trail.length;k++){
        const tt = clamp(p+trail[k], 0, 1);
        const pt = bez(tt);
        const fade = 1 - Math.abs(trail[k])*6;
        const size = 3.2 - k*0.55;
        const col = s.kind==="return" ? PALETTE.c1 : PALETTE.c4;
        ctx.beginPath();
        ctx.fillStyle = rgba(col, clamp(0.85*fade*(1-p*0.15),0,0.85));
        ctx.arc(pt.x, pt.y, Math.max(0.6,size), 0, Math.PI*2);
        ctx.fill();
      }

      if (p>=1){
        handleStreamArrival(s);
        streams.splice(i,1);
      }
    }
  }

  function drawSystemPulses(ctx){
    for (let i=systemPulses.length-1;i>=0;i--){
      const sp = systemPulses[i];
      const p = clamp((performance.now()-sp.start)/sp.duration,0,1);
      if (p>=1){ systemPulses.splice(i,1); continue; }
      const maxR = Math.max(window.innerWidth, window.innerHeight)*0.75;
      const r = lerp(20, maxR, p);
      const alpha = (1-p)*0.14;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
      ctx.strokeStyle = rgba(WARN_TINT, alpha);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  /* =================================================================
     CANVAS SETUP
  ================================================================= */
  const mainCanvas = document.getElementById("main");
  const mainCtx = mainCanvas.getContext("2d");
  const miniCanvas = document.getElementById("mini");
  const miniCtx = miniCanvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const topSub = document.getElementById("topSub");

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const mw = window.innerWidth, mh = window.innerHeight;
    mainCanvas.width = mw*dpr; mainCanvas.height = mh*dpr;
    mainCanvas.style.width = mw+"px"; mainCanvas.style.height = mh+"px";
    mainCtx.setTransform(dpr,0,0,dpr,0,0);

    const rect = miniCanvas.getBoundingClientRect();
    const mmw = rect.width||56, mmh = rect.height||56;
    miniCanvas.width = mmw*dpr; miniCanvas.height = mmh*dpr;
    miniCtx.setTransform(dpr,0,0,dpr,0,0);

    computeLayout();
    MODEL_ORDER.forEach(function(id){
      if (entities[id].cur.r === 10 && entities[id].cur.x === 0){
        entities[id].cur = { x:entities[id].target.x, y:entities[id].target.y, r:entities[id].target.r };
      }
    });
  }
  window.addEventListener("resize", resize);

  /* =================================================================
     DOM OVERLAY (hit-areas, labels, task chips)
  ================================================================= */
  const hitEls = {};
  MODEL_ORDER.forEach(function(id){
    const e = entities[id];
    const el = document.createElement("div");
    el.className = "model-hit";
    el.dataset.id = id;

    const label = document.createElement("div");
    label.className = "model-label";
    label.innerHTML = "<span class='model-name-text'>" + e.name + "</span><span class='model-purpose'>" + e.purpose + "</span>";
    el.appendChild(label);

    const task = document.createElement("div");
    task.className = "model-task";
    el.appendChild(task);

    overlay.appendChild(el);
    hitEls[id] = { el:el, label:label, task:task };

    el.addEventListener("mouseenter", function(){
      e.hovered = true;
      if (id !== activeMain) triggerWordOn(e, "notice");
    });
    el.addEventListener("mouseleave", function(){
      e.hovered = false;
      e.hoverOffset.x = 0; e.hoverOffset.y = 0;
    });
    el.addEventListener("mousemove", function(ev){
      if (id === activeMain) return;
      const rect = el.getBoundingClientRect();
      const dx = ev.clientX - (rect.left+rect.width/2);
      const dy = ev.clientY - (rect.top+rect.height/2);
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const maxNudge = e.cur.r * 0.16;
      const mag = Math.min(dist*0.18, maxNudge);
      e.hoverOffset.x = (dx/dist)*mag;
      e.hoverOffset.y = (dy/dist)*mag;
    });
    el.addEventListener("click", function(){
      if (id === "s5"){
        if (activeMain !== "s5") setActiveMain("s5"); else triggerWordOn(e,"click");
      } else {
        if (activeMain !== id) setActiveMain(id); else triggerWordOn(e,"click");
      }
    });
  });

  function statusLabel(state){
    if (state==="receiving") return "RECEIVING";
    if (state==="working") return "WORKING";
    if (state==="returning") return "RETURNING";
    if (state==="complete") return "COMPLETE";
    return "";
  }

  function syncOverlay(){
    MODEL_ORDER.forEach(function(id){
      const e = entities[id];
      const h = hitEls[id];
      const size = e.cur.r*2.6;
      h.el.style.width = size+"px";
      h.el.style.height = size+"px";
      h.el.style.transform = "translate(" + (e.cur.x-size/2) + "px," + (e.cur.y-size/2) + "px)";

      const isMain = id === activeMain;
      h.el.classList.toggle("is-main", isMain);
      h.el.classList.toggle("show-label", isMain || e.hovered);

      const showTask = e.taskState!=="idle" && e.taskText;
      h.task.classList.toggle("show", !!showTask);
      if (showTask){
        h.task.innerHTML = "<span class='status'>" + statusLabel(e.taskState) + "</span>" + e.taskText;
      }
    });
  }

  /* =================================================================
     MAIN LOOP
  ================================================================= */
  function updateEntities(){
    const now = performance.now();
    MODEL_ORDER.forEach(function(id){
      const e = entities[id];
      e.cur.x = lerp(e.cur.x, e.target.x, 0.075);
      e.cur.y = lerp(e.cur.y, e.target.y, 0.075);
      e.cur.r = lerp(e.cur.r, e.target.r, 0.075);
      e.hoverBoost = lerp(e.hoverBoost, e.hovered ? 1 : 0, 0.12);
      if (!e.hovered){
        e.hoverOffset.x = lerp(e.hoverOffset.x, 0, 0.15);
        e.hoverOffset.y = lerp(e.hoverOffset.y, 0, 0.15);
      }
      if (e.variant.branchBlink && now - e.branchAt > 2400){
        e.branchAt = now;
        e.branchGroup = Math.floor(Math.random()*24);
      }
      if (e.taskState === "working" && now > e.workUntil){
        e.taskState = "returning";
        spawnStream(id, "s5", "return");
      }
    });
  }

  function frame(){
    updateEntities();
    computeLayout();

    mainCtx.clearRect(0,0,mainCanvas.clientWidth, mainCanvas.clientHeight);
    drawSystemPulses(mainCtx);

    // faint "command space" boundary around S5 when it's the home/main sphere —
    // a quiet cue that this is deliberately protected negative space, not a diagram
    if (activeMain === "s5"){
      mainCtx.beginPath();
      mainCtx.arc(entities.s5.cur.x, entities.s5.cur.y, entities.s5.cur.r*1.55, 0, Math.PI*2);
      mainCtx.strokeStyle = rgba(PALETTE.c3, 0.035);
      mainCtx.lineWidth = 1;
      mainCtx.stroke();
    }

    const drawOrder = MODEL_ORDER.filter(function(id){ return id!=="s5"; }).concat(["s5"]);
    drawOrder.forEach(function(id){
      const e = entities[id];
      const cx = e.cur.x + e.hoverOffset.x;
      const cy = e.cur.y + e.hoverOffset.y;
      drawSphereVisual(mainCtx, cx, cy, e.cur.r, e, { hoverBoost:e.hoverBoost });
    });

    drawStreams(mainCtx);
    syncOverlay();
    renderWorkPanel();

    // the bottom-left mini brain always mirrors S5/LANUX itself — it is
    // LANUX's persistent presence, not whichever model happens to be focused
    const mmw = miniCanvas.clientWidth, mmh = miniCanvas.clientHeight;
    miniCtx.clearRect(0,0,mmw,mmh);
    drawSphereVisual(miniCtx, mmw/2, mmh/2, Math.min(mmw,mmh)*0.30, entities.s5, { particleScale:0.55, lineScale:0.5, phaseOffset:1.7 });

    requestAnimationFrame(frame);
  }

  /* =================================================================
     CONTROLS
  ================================================================= */
  function setVoiceMode(mode){
    entities[activeMain].mode = mode;
    if (activeMain !== "s5") entities.s5.mode = mode; // LANUX/S5 always reflects voice activity too
    document.querySelectorAll(".state-btn").forEach(function(b){
      b.classList.toggle("is-active", b.dataset.mode === mode);
    });
  }

  document.querySelectorAll(".state-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ setVoiceMode(btn.dataset.mode); });
  });
  document.querySelectorAll(".word-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      const word = btn.dataset.word;
      if (word === "warning"){
        triggerWarning(activeMain);
        logMessage(entities[activeMain].name.toUpperCase(), "Warning acknowledged — reviewing.");
      } else {
        triggerWordOn(entities[activeMain], word);
      }
    });
  });
  document.querySelectorAll(".deleg-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      const target = btn.dataset.deleg;
      if (target === "all") delegate(["coder","researcher","planner","tester","computer","git"]);
      else delegate([target]);
    });
  });
  document.querySelector('.state-btn[data-mode="idle"]').classList.add("is-active");

  /* =================================================================
     FULL DEMONSTRATION SCENARIO
     A scripted end-to-end workflow: speak -> S5 decides -> delegates to
     four specialists -> they work -> a peer (tester<->coder) exchange
     happens mid-flight -> each specialist returns results to S5 -> S5
     acknowledges. Purely a choreographed visual sequence.
  ================================================================= */
  let demoRunning = false;
  function runDemoScenario(){
    if (demoRunning) return;
    demoRunning = true;
    const demoBtn = document.getElementById("demoBtn");
    demoBtn.disabled = true;
    demoBtn.style.opacity = "0.35";

    logMessage("USER", "Set up authentication for the new service.");
    setVoiceMode("speak");

    setTimeout(function(){
      logMessage("LANUX-S5", "Breaking this into implementation, research, testing and repository prep.");
      delegate(
        ["coder","researcher","tester","git"],
        {
          coder:"Implement authentication flow",
          researcher:"Research OAuth requirements",
          tester:"Prepare authentication tests",
          git:"Prepare repository changes"
        },
        15000 // generous work window so the scripted beats below control pacing
      );
    }, 900);

    setTimeout(function(){ forceComplete("researcher", "OAuth research complete."); }, 5300);
    setTimeout(function(){ forceComplete("git", "Repository changes prepared."); }, 6000);
    setTimeout(function(){ forceComplete("coder", "Implementation complete."); }, 6600);

    setTimeout(function(){
      logMessage("TESTER → CODER", "Found an issue in the session handling.");
      spawnStream("tester", "coder", "peer");
    }, 7900);
    setTimeout(function(){
      logMessage("CODER → TESTER", "Fix applied.");
      spawnStream("coder", "tester", "peer");
    }, 8500);

    setTimeout(function(){ forceComplete("tester", "Validation complete."); }, 9400);

    setTimeout(function(){
      logMessage("LANUX-S5", "All results received. Authentication task complete.");
      setVoiceMode("idle");
      demoRunning = false;
      demoBtn.disabled = false;
      demoBtn.style.opacity = "";
    }, 11200);
  }
  document.getElementById("demoBtn").addEventListener("click", runDemoScenario);

  /* =================================================================
     INIT
  ================================================================= */
  resize();
  updateTopLabel();
  renderWorkPanel();
  logMessage("LANUX-S5", "Standing by. Ready for instructions.");
  requestAnimationFrame(frame);


})();
</script>
</body>
</html>
