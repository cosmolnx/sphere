      html = '<div class="work-empty">No active tasks. Delegate work from S5 to see it here.</div>';
    } else {
      const shown = active.slice(0,3); // current work stays the priority — never a giant list
      shown.forEach(function(id){
        const e = entities[id];
        html += '<div class="work-row"><div class="work-main"><div class="work-model">'+e.name+'</div>'
              + '<span class="work-task">'+ (e.taskText||"") +'</span></div>'
              + '<div class="work-status '+workStatusClass(e.taskState)+'">'+workStatusLabel(e.taskState)+'</div></div>';
      });
      if (active.length > shown.length){
        html += '<div class="work-more">+'+(active.length-shown.length)+' more working…</div>';
      }
    }
    if (workBody._sig !== html){
      workBody.innerHTML = html;
      workBody._sig = html;
    }
  }

  function renderHistoryPanel(){
    let html = "";
    if (completedLog.length===0){
      html = '<div class="work-empty">No completed work yet.</div>';
    } else {
      completedLog.slice(-3).reverse().forEach(function(item){
        html += '<div class="work-row"><div class="work-main"><div class="work-model">'+item.model+'</div>'
              + '<span class="work-task">'+item.task+'</span></div>'
              + '<div class="work-status complete">COMPLETE</div></div>';
      });
    }
    if (historyBody._sig !== html){
      historyBody.innerHTML = html;
      historyBody._sig = html;
    }
  }

  /* =================================================================
     DELEGATION
  ================================================================= */
  function spawnStream(fromId, toId, kind, taskText, workDuration){
    streams.push({
      fromId:fromId, toId:toId, kind:kind,
      start:performance.now(), duration: 900,
      taskText: taskText || "", workDuration: workDuration || 4200
    });
  }

  function delegate(ids, overrideTasks, overrideDuration){
    const s5 = entities.s5;
    s5.brainDelegateTargets = ids.slice();
    triggerWordOn(s5, "decision");
    logMessage("LANUX-S5", ids.length>1
      ? "Assigning work across " + ids.length + " specialists."
      : "Assigning a task to " + entities[ids[0]].name + ".");
    ids.forEach(function(id, idx){
      setTimeout(function(){
        const text = (overrideTasks && overrideTasks[id]) || TASKS[id];
        entities[id].taskState = "receiving";
        spawnStream("s5", id, "out", text, overrideDuration);
        logMessage("S5 → " + entities[id].name.toUpperCase(), text);
      }, 450 + idx*160);
    });
  }

  function forceComplete(modelId, customMsg){
    const e = entities[modelId];
    if (e.taskState === "idle" || e.taskState === "complete") return;
    e._pendingCompleteMsg = customMsg || null;
    e.taskState = "returning";
    spawnStream(modelId, "s5", "return");
  }


  function handleStreamArrival(s){
    if (s.kind === "peer"){
      triggerWordOn(entities[s.toId], "notice");
      return;
    }
    if (s.kind === "out"){
      const target = entities[s.toId];
      target.taskState = "receiving";
      target.taskText = s.taskText;
      triggerWordOn(target, "lanux");
      target.workUntil = performance.now() + s.workDuration;
      setTimeout(function(){
        if (target.taskState === "receiving"){
          target.taskState = "working";
          playModelSound(target, "working");
        }
      }, 350);
    } else {
      const src = entities[s.fromId];
      const doneTask = src.taskText;
      const msgText = src._pendingCompleteMsg || (doneTask ? doneTask + " — complete." : "Task complete.");
      entities.s5.brainReturnFrom = s.fromId;
      triggerWordOn(entities.s5, "ack");
      src.taskState = "complete";
      triggerWordOn(src, "complete");
      logMessage(src.name.toUpperCase() + " → LANUX-S5", msgText);
      completedLog.push({ model:src.name, task: doneTask || msgText });
      src._pendingCompleteMsg = null;
      src.taskText = "";
      setTimeout(function(){
        if (src.taskState === "complete") src.taskState = "idle";
      }, 700);
    }
  }

  /* =================================================================
     RENDER — one shared function draws any sphere entity, at any
     canvas / center / radius. Used for all 7 main-canvas spheres AND
     for the bottom-left mini sphere (which mirrors whichever entity
     is currently active).
  ================================================================= */
  function drawSphereVisual(ctx, cx, cy, baseR, entity, opts){
    opts = opts || {};
    const t = performance.now()/1000;
    const now = performance.now();
    const variant = entity.variant;

    let fx = { ampAdd:0, coreAdd:0, ringAdd:0, structured:0, spiral:0, ripple:0, ripplePhase:0, rotBoost:0, flash:0, tint:0 };
    if (entity.effect){
      const p = clamp((now-entity.effect.start)/entity.effect.duration, 0, 1);
      fx = effectParams(entity.effect.name, p, variant);
      if (p>=1) entity.effect=null;
    }

    const workingBoost = entity.taskState==="working" ? 0.22
      : (entity.taskState==="receiving"||entity.taskState==="returning") ? 0.12 : 0;

    const rawAmp = baseAmplitude(entity.mode, t, entity.seedA, entity.seedB, variant) + fx.ampAdd + workingBoost + (opts.hoverBoost||0)*0.10;
    entity.smoothedAmp = lerp(entity.smoothedAmp, rawAmp, 0.12);
    const amp = clamp(entity.smoothedAmp, 0, 1.35);

    const hoverScale = 1 + (entity.hoverBoost||0)*0.10;
    const breathe = (1 + amp*0.16) * hoverScale;
    const sphereR = baseR * breathe;

    const rotSpeed = variant.rotSpeed + fx.rotBoost*0.35 + (entity.mode!=="idle" ? 0.04 : 0);
    const rotY = t*rotSpeed + entity.seedC*0.001 + (opts.phaseOffset||0);
    let rotX = Math.sin(t*0.13 + entity.seedA*0.01) * 0.32;
    if (variant.asym) rotX += Math.sin(t*0.31 + entity.seedB*0.01) * 0.13;

    const cosY=Math.cos(rotY), sinY=Math.sin(rotY), cosX=Math.cos(rotX), sinX=Math.sin(rotX);

    // Originkit "Particle Gimbal" — independent depth layers spun at their
    // own integer turn-ratio (plus a counter-rotating layer), each tipped
    // to its own tilt, rather than the whole sphere turning as one rigid
    // body. Layers diverge further apart under activity (thinking/working)
    // and settle close together at idle.
    const gimbalLayers = variant.gimbalLayers || 0;
    let layerRot = null;
    if (gimbalLayers > 0){
      const ratios = [1, -2, 2, 3];
      const tiltOffsets = [0, 0.32, -0.26, 0.42];
      const diverge = 1 + amp*0.6;
      layerRot = [];
      for (let L=0; L<gimbalLayers; L++){
        const lRotY = t*rotSpeed*ratios[L % ratios.length]*diverge + entity.seedC*0.001*(L+1) + (opts.phaseOffset||0);
        const lRotX = rotX + tiltOffsets[L % tiltOffsets.length];
        layerRot.push({ cosY:Math.cos(lRotY), sinY:Math.sin(lRotY), cosX:Math.cos(lRotX), sinX:Math.sin(lRotX) });
      }
    }

    // tint blend (warning warmth)
    let tintAmount = 0;
    if (entity.tintUntil && now < entity.tintUntil && entity.tintDuration){
      tintAmount = clamp((entity.tintUntil-now)/entity.tintDuration, 0, 1);
    }
    tintAmount = Math.max(tintAmount, fx.tint*0.6);
    const c1 = tintAmount>0.001 ? mixColor(PALETTE.c1, WARN_TINT, tintAmount*0.38) : PALETTE.c1;
    const c3 = tintAmount>0.001 ? mixColor(PALETTE.c3, WARN_TINT, tintAmount*0.34) : PALETTE.c3;
    const c4 = tintAmount>0.001 ? mixColor(PALETTE.c4, WARN_TINT, tintAmount*0.26) : PALETTE.c4;

    // outer glow
    const glowFlicker = 0.85 + 0.15*Math.sin(t*3.2+entity.seedC)*(0.4+amp);
    const outerGlowR = sphereR*(1.9+amp*0.4);
    const gGrad = ctx.createRadialGradient(cx,cy,sphereR*0.4, cx,cy,outerGlowR);
    gGrad.addColorStop(0, rgba(c1, 0.10*glowFlicker + fx.flash*0.15));
    gGrad.addColorStop(0.5, rgba(c3, 0.045*glowFlicker));
    gGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gGrad;
    ctx.beginPath(); ctx.arc(cx,cy,outerGlowR,0,Math.PI*2); ctx.fill();

    // Originkit "Harmonic Shell" — a deforming outer boundary whose radius
    // is a sum of sine terms (lobes wrapping the equator, rings running
    // pole-to-pole), with the wave counts drifting continuously so the
    // form breathes rather than snapping between shapes. Reads as a
    // protective/structural membrane around the neural core, distinct
    // from the core's own particles and rings.
    if (variant.harmonicShell){
      const hs = variant.harmonicShell;
      const shellR = sphereR*(1.12+amp*0.06);
      const lobeCount = hs.lobes + Math.sin(t*0.05+entity.seedA*0.001)*0.4;
      const ringCountHs = hs.rings + Math.sin(t*0.04+entity.seedB*0.001)*0.3;
      const ampNow = hs.ampFactor*(0.6+amp*0.9)*(1+fx.flash*0.8);
      ctx.beginPath();
      const steps = 72;
      for (let s=0;s<=steps;s++){
        const ang = (s/steps)*Math.PI*2;
        const wobble = Math.sin(ang*lobeCount + t*0.18) + 0.6*Math.sin(ang*ringCountHs*0.5 - t*0.12);
        const r = shellR * (1 + wobble*ampNow);
        const px = cx + Math.cos(ang)*r, py = cy + Math.sin(ang)*r*0.94;
        if (s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.strokeStyle = rgba(c4, 0.14 + amp*0.10 + fx.flash*0.12);
      ctx.lineWidth = Math.max(0.7, (opts.lineScale||1)*0.85);
      ctx.stroke();
    }

    // rings
    const ringCount = variant.ringCount;
    for (let idx=0; idx<ringCount; idx++){
      const rMul = 1.12 + idx*0.12;
      const tiltBase = 0.15 + idx*0.22;
      const speed = 0.08 + idx*0.045;
      const dir = idx%2===0 ? 1 : -1;
      const ringR = sphereR * rMul * (1 + fx.ringAdd*0.5) * variant.ringProminence;
      const ringRotY = t*speed*dir + idx*1.7 + (opts.phaseOffset||0) + entity.seedB*0.001;
      const squash = 0.28 + 0.24*Math.sin(tiltBase + Math.sin(t*0.07+idx+entity.seedA*0.001));
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(ringRotY*0.15);
      ctx.scale(1, Math.max(0.10, Math.abs(squash)));
      ctx.beginPath(); ctx.arc(0,0,ringR,0,Math.PI*2);
      ctx.strokeStyle = rgba(c3, (0.12+idx*0.01) + fx.flash*0.2 + amp*0.05);
      ctx.lineWidth = Math.max(0.6, (opts.lineScale||1)*0.9);
      ctx.stroke();
      ctx.restore();
    }

    // mechanical "sweep" beam (Pilot)
    if (variant.sweep){
      const sweepAngle = t*1.15 + entity.seedA*0.01;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(sweepAngle);
      ctx.beginPath();
      ctx.arc(0,0, sphereR*1.2, -0.22, 0.22);
      ctx.strokeStyle = rgba(c4, 0.30 + fx.flash*0.2);
      ctx.lineWidth = Math.max(0.8,(opts.lineScale||1)*1.1);
      ctx.stroke();
      ctx.restore();
    }

    // perimeter radar arcs (Sentinel) — two independent counter-rotating
    // detection arcs hugging the shell, distinct from Pilot's single beam
    // and Watcher's node-level scan band
    if (variant.perimeterScan){
      [ {speed:0.7, dir:1, r:1.14, span:0.5, alpha:0.32},
        {speed:0.5, dir:-1, r:1.24, span:0.32, alpha:0.20} ].forEach(function(arc){
        const ang = t*arc.speed*arc.dir + entity.seedB*0.01;
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.arc(0,0, sphereR*arc.r, -arc.span/2, arc.span/2);
        ctx.strokeStyle = rgba(c4, arc.alpha + fx.flash*0.15);
        ctx.lineWidth = Math.max(0.7,(opts.lineScale||1)*0.9);
        ctx.stroke();
        ctx.restore();
      });
    }

    // diagnostic scan band(s) (Watcher) — one or two independent repeating
    // sweep angles that briefly brighten whichever nodes they pass over,
    // reading as multiple regions being inspected rather than one
    const scanPhase = variant.scanBand ? (t*1.1 + entity.seedA*0.001) % (Math.PI*2) : null;
    const scanPhase2 = variant.scanBand2 ? (t*0.7 + Math.PI + entity.seedB*0.001) % (Math.PI*2) : null;

    function projectParticles(list, radiusMul){
      const projected = [];
      for (let i=0;i<list.length;i++){
        const p = list[i];
        const drift = 1 + 0.05*variant.jitterMul*Math.sin(t*p.freq1+p.seed1)*(0.4+amp)
                        + 0.03*variant.jitterMul*Math.sin(t*p.freq2+p.seed2+i*0.01);

        let vx=p.x0, vy=p.y0, vz=p.z0;
        const structAmt = clamp(variant.structuredBase + fx.structured + (variant.reorganizeOnWork && entity.taskState==="working" ? variant.reorganizeOnWork : 0), 0, 1);
        if (structAmt > 0.001){
          const sv = structuredVector(p);
          vx = lerp(vx, sv.x, structAmt);
          vy = lerp(vy, sv.y, structAmt);
          vz = lerp(vz, sv.z, structAmt);
        }

        let radialScale = drift;
        if (fx.spiral>0.001) radialScale *= (1 - fx.spiral*0.45);
        if (fx.ripple>0.001){
          const wave = Math.sin((p.distIndex*10 - fx.ripplePhase*14));
          radialScale *= (1 + Math.max(0,wave)*fx.ripple*0.35);
        }
        // Originkit "Liquid Sphere" / "Harmonic Shell" principle — a
        // coherent low-frequency wave travels across the whole surface
        // (a function of angular position and time), rather than each
        // particle jittering independently. Reads as breathing/rippling
        // instead of noise. "erratic" (Hackathon) drifts its own wave
        // count over time so the mutation itself feels intentional.
        if (variant.liquidWave){
          const lw = variant.liquidWave;
          const count = lw.erratic ? lw.count + Math.sin(t*0.17+entity.seedB*0.002)*2.2 : lw.count;
          const wave2 = Math.sin(p.theta*count - t*lw.speed + entity.seedA*0.001);
          radialScale *= (1 + wave2*lw.ampFactor*(0.5+amp*0.8));
        }
        radialScale *= (1 + amp*0.10);
        radialScale *= radiusMul;

        const rad = sphereR * radialScale;
        const rs = layerRot ? layerRot[i % gimbalLayers] : null;
        const rCosY = rs ? rs.cosY : cosY, rSinY = rs ? rs.sinY : sinY;
        const rCosX = rs ? rs.cosX : cosX, rSinX = rs ? rs.sinX : sinX;
        let rx = vx*rCosY - vz*rSinY;
        let rz = vx*rSinY + vz*rCosY;
        let ry = vy*rCosX - rz*rSinX;
        rz = vy*rSinX + rz*rCosX;

        const sx = cx + rx*rad, sy = cy + ry*rad;
        const depth = (rz+1)/2;

        let extraAlpha = 0;
        if (scanPhase !== null){
          let diff = Math.abs((p.theta % (Math.PI*2)) - scanPhase);
          if (diff > Math.PI) diff = Math.PI*2 - diff;
          if (diff < 0.32) extraAlpha = (1 - diff/0.32) * 0.65;
        }
        if (scanPhase2 !== null){
          let diff2 = Math.abs((p.theta % (Math.PI*2)) - scanPhase2);
          if (diff2 > Math.PI) diff2 = Math.PI*2 - diff2;
          if (diff2 < 0.26) extraAlpha = Math.max(extraAlpha, (1 - diff2/0.26) * 0.55);
        }

        // Sentinel — a warning selectively lights only outer-shell (high
        // distIndex) nodes instead of tinting every node in the sphere
        let warnMask = 1;
        if (variant.selectiveWarning){
          warnMask = p.distIndex > 0.55 ? 1 : 0.12;
        }

        let isGlyph = false, glyphChar = null;
        if (variant.codeGlyphs){
          if (p.glyphChar === undefined){
            p.glyphChar = GLYPH_CHARS[Math.floor((p.seed1/(Math.PI*2))*GLYPH_CHARS.length) % GLYPH_CHARS.length];
          }
          const workingBoost = entity.taskState==="working" ? 0.32 : 0;
          const glyphWave = Math.sin(t*0.32 + p.seed1*2.7);
          if (glyphWave > (0.6 - workingBoost)){
            isGlyph = true;
            glyphChar = p.glyphChar;
          }
        }

        projected.push({sx:sx, sy:sy, depth:depth, extraAlpha:extraAlpha, isGlyph:isGlyph, glyphChar:glyphChar, warnMask:warnMask});
      }
      return projected; // kept in original index order — connections/signals need direct index lookup
    }

    function drawNodes(projected, sizeMul){
      const order = projected.map(function(_,i){ return i; });
      order.sort(function(a,b){ return projected[a].depth-projected[b].depth; });
      const shape = variant.nodeShape || "dot";
      for (let k=0;k<order.length;k++){
        const pr = projected[order[k]];
        const size = lerp(0.55,2.1,pr.depth) * (opts.particleScale||1) * sizeMul;
        const alpha = clamp((lerp(0.10,0.85,pr.depth)*(0.55+amp*0.5)) + pr.extraAlpha, 0, 1);

        // Sentinel: warning tint only applies to the selected (outer-shell)
        // nodes — everything else keeps reading as normal LANUX blue-grey
        let nodeC1 = c1, nodeC4 = c4;
        if (variant.selectiveWarning && tintAmount>0.001 && pr.warnMask<0.99){
          const eff = tintAmount*pr.warnMask;
          nodeC1 = mixColor(PALETTE.c1, WARN_TINT, eff*0.38);
          nodeC4 = mixColor(PALETTE.c4, WARN_TINT, eff*0.26);
        }
        const col = mixColor(nodeC1, nodeC4, clamp(pr.depth*0.7 + fx.flash*0.3 + pr.extraAlpha*0.4, 0, 1));

        if (pr.isGlyph){
          const fontSize = Math.max(5, lerp(6,11,pr.depth) * (opts.particleScale||1) * sizeMul);
          ctx.font = fontSize + "px 'SF Mono', 'Courier New', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = rgba(col, clamp(alpha*1.1,0,1));
          ctx.fillText(pr.glyphChar, pr.sx, pr.sy);
          continue;
        }

        // outward direction from sphere center — used by shapes that need
        // an orientation (dashes, teardrops, ticks) without extra state
        const odx = pr.sx-cx, ody = pr.sy-cy;
        const odist = Math.sqrt(odx*odx+ody*ody) || 1;
        const ux = odx/odist, uy = ody/odist;

        ctx.fillStyle = rgba(col, alpha);
        ctx.strokeStyle = rgba(col, alpha);

        if (shape === "block"){ // Forge — small precise square
          const s = size*1.5;
          ctx.save(); ctx.translate(pr.sx,pr.sy); ctx.rotate(t*0.08+pr.depth*2);
          ctx.fillRect(-s/2,-s/2,s,s);
          ctx.restore();
        } else if (shape === "layer"){ // Architect — a short horizontal structural bar
          const w = size*2.4, h = size*0.7;
          ctx.fillRect(pr.sx-w/2, pr.sy-h/2, w, h);
        } else if (shape === "waypoint"){ // Vector — small diamond
          const s = size*1.6;
          ctx.save(); ctx.translate(pr.sx,pr.sy); ctx.rotate(Math.PI/4);
          ctx.fillRect(-s/2,-s/2,s,s);
          ctx.restore();
        } else if (shape === "dash"){ // Pilot — short radial directional dash
          const len = size*2.4;
          ctx.beginPath();
          ctx.moveTo(pr.sx-ux*len*0.5, pr.sy-uy*len*0.5);
          ctx.lineTo(pr.sx+ux*len*0.5, pr.sy+uy*len*0.5);
          ctx.lineWidth = Math.max(0.6, size*0.6);
          ctx.stroke();
        } else if (shape === "tick"){ // Sentinel — short tangent perimeter mark
          const len = size*2.0;
          ctx.beginPath();
          ctx.moveTo(pr.sx-uy*len*0.5, pr.sy+ux*len*0.5);
          ctx.lineTo(pr.sx+uy*len*0.5, pr.sy-ux*len*0.5);
          ctx.lineWidth = Math.max(0.6, size*0.55);
          ctx.stroke();
        } else if (shape === "cross"){ // Watcher — tiny inspection crosshair
          const s = size*1.3;
          ctx.lineWidth = Math.max(0.5, size*0.45);
          ctx.beginPath(); ctx.moveTo(pr.sx-s,pr.sy); ctx.lineTo(pr.sx+s,pr.sy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(pr.sx,pr.sy-s); ctx.lineTo(pr.sx,pr.sy+s); ctx.stroke();
        } else if (shape === "pair"){ // Memory — tight associative twin dots
          const off = size*1.1;
          ctx.beginPath(); ctx.arc(pr.sx-off*0.5*uy, pr.sy+off*0.5*ux, size*0.6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(pr.sx+off*0.5*uy, pr.sy-off*0.5*ux, size*0.6, 0, Math.PI*2); ctx.fill();
        } else if (shape === "teardrop"){ // Scout — small outward-pointing probe
          ctx.save(); ctx.translate(pr.sx,pr.sy); ctx.rotate(Math.atan2(uy,ux));
          ctx.beginPath();
          ctx.ellipse(0,0, size*1.7, size*0.85, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        } else if (shape === "soft"){ // Artisan — soft blurred refined node
          const grad = ctx.createRadialGradient(pr.sx,pr.sy,0, pr.sx,pr.sy, size*2.2);
          grad.addColorStop(0, rgba(col, alpha));
          grad.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(pr.sx,pr.sy, size*2.2, 0, Math.PI*2); ctx.fill();
        } else if (shape === "spark"){ // Hackathon — small irregular unstable mark
          const jitter = Math.sin(t*6+pr.sx*0.7)*0.5+0.5;
          const sides = 3;
          ctx.beginPath();
          for (let s=0;s<sides;s++){
            const ang = (s/sides)*Math.PI*2 + t*1.4 + pr.sy*0.01;
            const rr = size*(1.2+jitter*0.9);
            const px = pr.sx+Math.cos(ang)*rr, py = pr.sy+Math.sin(ang)*rr;
            if (s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
          }
          ctx.closePath();
          ctx.fill();
        } else if (shape === "neuron"){ // S5 — a dot with a faint synapse halo
          ctx.beginPath(); ctx.arc(pr.sx,pr.sy,size,0,Math.PI*2); ctx.fill();
          if (pr.depth > 0.6){
            ctx.beginPath();
            ctx.arc(pr.sx,pr.sy, size*2.2, 0, Math.PI*2);
            ctx.strokeStyle = rgba(col, alpha*0.28);
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        } else { // plain dot — fallback, currently unused by any of the 11
          ctx.beginPath();
          ctx.arc(pr.sx, pr.sy, size, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    const mainProjected = projectParticles(entity.particles, 1);

    // neural connections — the graph that makes this read as a network
    // rather than a particle cloud. Alpha is depth-weighted so far-side
    // links recede, exactly like the nodes they join.
    const conns = entity.connections;
    if (conns && conns.length){
      // Vector — while WORKING, traffic converges onto one "chosen route"
      // and everything else visibly dims, reading as a decided strategy
      if (variant.routeConverge){
        if (entity.taskState === "working"){
          if (entity.chosenRoute == null || entity.chosenRoute >= conns.length){
            entity.chosenRoute = Math.floor(Math.random()*conns.length);
          }
        } else if (entity.taskState === "idle"){
          entity.chosenRoute = null;
        }
      }

      const lineBase = Math.max(0.4, (opts.lineScale||1)*0.6);
      for (let ci=0; ci<conns.length; ci++){
        const c = conns[ci];
        let gateAlpha = variant.dynamicTopology ? c.alpha : 1;
        if (variant.routeConverge && entity.chosenRoute != null){
          gateAlpha *= (ci === entity.chosenRoute) ? 1.7 : 0.12;
        }
        if (gateAlpha <= 0.02) continue;
        const A = mainProjected[c.a], B = mainProjected[c.b];
        if (!A || !B) continue;
        const avgDepth = (A.depth+B.depth)/2;
        const a = clamp(0.05 + avgDepth*0.20, 0, 0.34) * gateAlpha * (0.55 + amp*0.6) + fx.flash*0.08;
        ctx.beginPath();
        ctx.moveTo(A.sx, A.sy);
        ctx.lineTo(B.sx, B.sy);
        ctx.strokeStyle = rgba(mixColor(c1,c4,avgDepth*0.45), a);
        ctx.lineWidth = lineBase * (0.5 + avgDepth*0.6);
        ctx.stroke();
      }

      // signals — small pulses traveling along a connection, the visual
      // equivalent of information moving through the network
      const activity = 1 + amp*1.6 + (opts.hoverBoost||0)*0.9 + (entity.mode==="listen"||entity.mode==="speak" ? 0.4 : 0);
      if (now > entity.nextSignalAt){
        const gap = (variant.signalRate||700) / activity;
        entity.nextSignalAt = now + gap*(0.7+Math.random()*0.6);
        let tries = 0, ci;
        do { ci = Math.floor(Math.random()*conns.length); tries++; }
        while (variant.dynamicTopology && conns[ci].alpha < 0.5 && tries < 6);
        if (variant.routeConverge && entity.chosenRoute != null && Math.random()<0.75) ci = entity.chosenRoute;
        entity.signals.push({ ci:ci, start:now, duration: variant.signalDuration||600 });
      }
      for (let si=entity.signals.length-1; si>=0; si--){
        const sig = entity.signals[si];
        const p2 = (now - sig.start) / sig.duration;
        if (p2 >= 1){ entity.signals.splice(si,1); continue; }
        const c = conns[sig.ci];
        if (!c){ entity.signals.splice(si,1); continue; }
        const A = mainProjected[c.a], B = mainProjected[c.b];
        if (!A || !B) continue;
        const sxp = lerp(A.sx,B.sx,p2), syp = lerp(A.sy,B.sy,p2);
        const depthp = lerp(A.depth,B.depth,p2);
        const glowEnv = Math.sin(p2*Math.PI);
        ctx.beginPath();
        ctx.fillStyle = rgba(c4, clamp(0.3+depthp*0.6,0,1)*glowEnv);
        ctx.arc(sxp, syp, lerp(1.1,2.5,depthp)*(opts.particleScale||1), 0, Math.PI*2);
        ctx.fill();
      }
    }

    drawNodes(mainProjected, 1);
    if (variant.extraShell && entity.innerParticles){
      drawNodes(projectParticles(entity.innerParticles, 0.52), 0.85);
    }

    // core
    const coreBrightness = clamp(0.55 + amp*0.5 + fx.coreAdd, 0, 1.7);
    const coreR = sphereR*(0.16+coreBrightness*0.05);
    const isS5Brain = entity.id === "s5" && entity.brain;
    // S5's own brain-core cluster (drawn further below) is the "central
    // decision region" now, so the shared glow/dot behind it is dialed
    // back to ambient bloom rather than a solid disc — otherwise the
    // structure would just be washed out under it. Every other model's
    // core is untouched.
    const coreGlowMul = isS5Brain ? 0.7 : 1;
    const coreDotMul = isS5Brain ? 0.32 : 1;
    const coreGrad = ctx.createRadialGradient(cx,cy,0, cx,cy, coreR*2.4);
    coreGrad.addColorStop(0, rgba(c4, clamp(0.95*coreBrightness*coreGlowMul,0,1)));
    coreGrad.addColorStop(0.35, rgba(c3, clamp(0.5*coreBrightness*coreGlowMul,0,1)));
    coreGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(cx,cy,coreR*2.4,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = rgba(c4, clamp(0.9*coreBrightness*coreDotMul,0,1));
    ctx.arc(cx,cy,coreR*(isS5Brain?0.30:0.55),0,Math.PI*2); ctx.fill();

    // per-model nucleus decoration — this is what keeps two cores from
    // ever reading as "the same glowing dot with a different colour"
    drawNucleus(ctx, variant.coreStyle, cx, cy, coreR, coreBrightness, t, entity.seedC);

    // S5's persistent artificial brain — layered on top of the shared
    // glow/rings/nucleus above, additive, S5-only
    if (entity.id === "s5" && entity.brain){
      renderS5Brain(ctx, cx, cy, sphereR, entity, cosY, sinY, cosX, sinX, c1, c3, c4, t, now, amp, opts);
    }
  }

  function drawNucleus(ctx, style, cx, cy, coreR, brightness, t, seed){
    if (!style) return;
    const a = clamp(0.35*brightness, 0, 0.9);
    ctx.save();
    ctx.translate(cx, cy);

    if (style === "nucleus"){ // S5 — nested concentric nucleus rings
      for (let i=1;i<=3;i++){
        ctx.beginPath();
        ctx.arc(0,0, coreR*(1.3+i*0.55), 0, Math.PI*2);
        ctx.strokeStyle = rgba(PALETTE.c4, a*(0.5/i));
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else if (style === "ping"){ // Scout — an expanding search ping
      const p = (t*0.6) % 1;
      ctx.beginPath();
      ctx.arc(0,0, coreR*(1.4+p*2.2), 0, Math.PI*2);
      ctx.strokeStyle = rgba(PALETTE.c4, a*(1-p)*0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (style === "bracket"){ // Forge — a slowly rotating code bracket
      ctx.rotate(t*0.3+seed*0.001);
      ctx.strokeStyle = rgba(PALETTE.c4, a);
      ctx.lineWidth = 1.2;
      const s = coreR*1.7;
      ctx.beginPath(); ctx.moveTo(-s*0.3,-s); ctx.lineTo(-s,-s); ctx.lineTo(-s,s); ctx.lineTo(-s*0.3,s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.3,-s); ctx.lineTo(s,-s); ctx.lineTo(s,s); ctx.lineTo(s*0.3,s); ctx.stroke();
    } else if (style === "hex"){ // Architect — a stable hexagonal framework
      ctx.rotate(t*0.05);
      ctx.beginPath();
      for (let i=0;i<6;i++){
        const ang = i*Math.PI/3;
        const px = Math.cos(ang)*coreR*1.9, py = Math.sin(ang)*coreR*1.9;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.strokeStyle = rgba(PALETTE.c4, a*0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (style === "petal"){ // Artisan — a soft rotating flower outline
      ctx.rotate(t*0.12+seed*0.001);
      ctx.beginPath();
      for (let i=0;i<=40;i++){
        const ang = (i/40)*Math.PI*2;
        const rr = coreR*(1.6+0.4*Math.sin(ang*5));
        const px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = rgba(PALETTE.c4, a*0.7);
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (style === "guard"){ // Sentinel — a protective double ring
      [1.5,2.0].forEach(function(m){
        ctx.beginPath();
        ctx.arc(0,0, coreR*m, 0, Math.PI*2);
        ctx.strokeStyle = rgba(PALETTE.c4, a*0.6);
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    } else if (style === "ticks"){ // Vector — radiating route tick marks
      ctx.rotate(t*0.08);
      for (let i=0;i<8;i++){
        const ang = i*Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*coreR*1.5, Math.sin(ang)*coreR*1.5);
        ctx.lineTo(Math.cos(ang)*coreR*2.1, Math.sin(ang)*coreR*2.1);
        ctx.strokeStyle = rgba(PALETTE.c4, a*0.7);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (style === "arrow"){ // Pilot — an elongated directional nucleus
      ctx.rotate(t*0.2);
      ctx.beginPath();
      ctx.moveTo(coreR*2.2,0); ctx.lineTo(-coreR*0.8,coreR*1.0); ctx.lineTo(-coreR*0.8,-coreR*1.0);
      ctx.closePath();
      ctx.strokeStyle = rgba(PALETTE.c4, a*0.7);
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (style === "ripple"){ // Memory — concentric associative pulses
      for (let i=0;i<2;i++){
        const p = ((t*0.4 + i*0.5) % 1);
        ctx.beginPath();
        ctx.arc(0,0, coreR*(1.2+p*1.8), 0, Math.PI*2);
        ctx.strokeStyle = rgba(PALETTE.c4, a*(1-p)*0.6);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (style === "iris"){ // Watcher — a rotating observation aperture
      ctx.rotate(t*0.4);
      for (let i=0;i<6;i++){
        const ang = i*Math.PI/3;
        ctx.beginPath();
        ctx.arc(Math.cos(ang)*coreR*0.9, Math.sin(ang)*coreR*0.9, coreR*0.35, 0, Math.PI*2);
        ctx.strokeStyle = rgba(PALETTE.c4, a*0.55);
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else if (style === "flicker"){ // Hackathon — an unstable, irregular nucleus
      const jitter = Math.sin(t*9+seed*0.01)*0.5+0.5;
      ctx.beginPath();
      const sides = 5 + (jitter>0.5?1:0);
      for (let i=0;i<sides;i++){
        const ang = (i/sides)*Math.PI*2 + t*0.6;
        const rr = coreR*(1.5+jitter*0.6);
        const px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.strokeStyle = rgba(PALETTE.c4, a*0.6);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  /* =================================================================
     STREAMS & SYSTEM PULSES (drawn on main canvas only)
  ================================================================= */
  function drawStreams(ctx){
    for (let i=streams.length-1;i>=0;i--){
      const s = streams[i];
      const p = clamp((performance.now()-s.start)/s.duration, 0, 1);
      const from = entities[s.fromId], to = entities[s.toId];
      const x0=from.cur.x, y0=from.cur.y, x1=to.cur.x, y1=to.cur.y;
      const mx=(x0+x1)/2, my=(y0+y1)/2 - Math.abs(x1-x0)*0.12 - 20;

      function bez(tt){
        const it=1-tt;
        return {
          x: it*it*x0 + 2*it*tt*mx + tt*tt*x1,
          y: it*it*y0 + 2*it*tt*my + tt*tt*y1
        };
      }

      // faint guide path
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.quadraticCurveTo(mx,my,x1,y1);
      ctx.strokeStyle = rgba(PALETTE.c3, 0.06);
      ctx.lineWidth = 1;
      ctx.stroke();

      // comet with trailing dots
      const trail = [0, -0.035, -0.07, -0.105];
      for (let k=0;k<trail.length;k++){
        const tt = clamp(p+trail[k], 0, 1);
        const pt = bez(tt);
        const fade = 1 - Math.abs(trail[k])*6;
        const size = 3.2 - k*0.55;
        const col = s.kind==="return" ? PALETTE.c1 : PALETTE.c4;
        ctx.beginPath();
        ctx.fillStyle = rgba(col, clamp(0.85*fade*(1-p*0.15),0,0.85));
        ctx.arc(pt.x, pt.y, Math.max(0.6,size), 0, Math.PI*2);
        ctx.fill();
      }

      if (p>=1){
        handleStreamArrival(s);
        streams.splice(i,1);
      }
    }
  }

  function drawSystemPulses(ctx){
    for (let i=systemPulses.length-1;i>=0;i--){
      const sp = systemPulses[i];
      const p = clamp((performance.now()-sp.start)/sp.duration,0,1);
      if (p>=1){ systemPulses.splice(i,1); continue; }
      const maxR = Math.max(window.innerWidth, window.innerHeight)*0.75;
      const r = lerp(20, maxR, p);
      const alpha = (1-p)*0.14;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
      ctx.strokeStyle = rgba(WARN_TINT, alpha);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  /* =================================================================
     CANVAS SETUP
  ================================================================= */
  const mainCanvas = document.getElementById("main");
  const mainCtx = mainCanvas.getContext("2d");
  const miniCanvas = document.getElementById("mini");
  const miniCtx = miniCanvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const topLabelEl = document.getElementById("topLabel");
  const headerNameEl = document.getElementById("headerName");
  const headerPurposeEl = document.getElementById("headerPurpose");
  const statusBarEl = document.getElementById("statusBar");
  const statusTextEl = document.getElementById("statusText");
  const sidebarEl = document.getElementById("sidebar");
  const sidebarToggleEl = document.getElementById("sidebarToggle");
  const sidebarToggleIconEl = document.getElementById("sidebarToggleIcon");

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const mw = window.innerWidth, mh = window.innerHeight;
    mainCanvas.width = mw*dpr; mainCanvas.height = mh*dpr;
    mainCanvas.style.width = mw+"px"; mainCanvas.style.height = mh+"px";
    mainCtx.setTransform(dpr,0,0,dpr,0,0);

    const rect = miniCanvas.getBoundingClientRect();
    const mmw = rect.width||56, mmh = rect.height||56;
    miniCanvas.width = mmw*dpr; miniCanvas.height = mmh*dpr;
    miniCtx.setTransform(dpr,0,0,dpr,0,0);

    computeLayout();
    MODEL_ORDER.forEach(function(id){
      if (entities[id].cur.r === 10 && entities[id].cur.x === 0){
        entities[id].cur = { x:entities[id].target.x, y:entities[id].target.y, r:entities[id].target.r };
      }
    });
  }
  window.addEventListener("resize", resize);

  /* =================================================================
     DOM OVERLAY (hit-areas, labels, task chips)
  ================================================================= */
  const hitEls = {};
  MODEL_ORDER.forEach(function(id){
    const e = entities[id];
    const el = document.createElement("div");
    el.className = "model-hit";
    el.dataset.id = id;

    const label = document.createElement("div");
    label.className = "model-label";
    label.innerHTML = "<span class='model-name-text'>" + e.name + "</span><span class='model-purpose'>" + e.purpose + "</span>";
    el.appendChild(label);

    const task = document.createElement("div");
    task.className = "model-task";
    el.appendChild(task);

    overlay.appendChild(el);
    hitEls[id] = { el:el, label:label, task:task };

    el.addEventListener("mouseenter", function(){
      e.hovered = true;
      if (id !== activeMain) triggerWordOn(e, "notice");
    });
    el.addEventListener("mouseleave", function(){
      e.hovered = false;
      e.hoverOffset.x = 0; e.hoverOffset.y = 0;
    });
    el.addEventListener("mousemove", function(ev){
      if (id === activeMain) return;
      const rect = el.getBoundingClientRect();
      const dx = ev.clientX - (rect.left+rect.width/2);
      const dy = ev.clientY - (rect.top+rect.height/2);
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const maxNudge = e.cur.r * 0.16;
      const mag = Math.min(dist*0.18, maxNudge);
      e.hoverOffset.x = (dx/dist)*mag;
      e.hoverOffset.y = (dy/dist)*mag;
    });
    el.addEventListener("click", function(){
      if (id === "s5"){
        if (activeMain !== "s5") setActiveMain("s5"); else triggerWordOn(e,"click");
      } else {
        if (activeMain !== id) setActiveMain(id); else triggerWordOn(e,"click");
      }
    });
  });

  function statusLabel(state){
    if (state==="receiving") return "RECEIVING";
    if (state==="working") return "WORKING";
    if (state==="returning") return "RETURNING";
    if (state==="complete") return "COMPLETE";
    return "";
  }

  function syncOverlay(){
    MODEL_ORDER.forEach(function(id){
      const e = entities[id];
      const h = hitEls[id];
      const size = e.cur.r*2.6;
      h.el.style.width = size+"px";
      h.el.style.height = size+"px";
      h.el.style.transform = "translate(" + (e.cur.x-size/2) + "px," + (e.cur.y-size/2) + "px)";

      const isMain = id === activeMain;
      h.el.classList.toggle("is-main", isMain);
      h.el.classList.toggle("show-label", isMain || e.hovered);

      const showTask = e.taskState!=="idle" && e.taskText;
      h.task.classList.toggle("show", !!showTask);
      if (showTask){
        h.task.innerHTML = "<span class='status'>" + statusLabel(e.taskState) + "</span>" + e.taskText;
      }
    });
  }

  /* =================================================================
     MAIN LOOP
  ================================================================= */
  function updateEntities(){
    const now = performance.now();
    MODEL_ORDER.forEach(function(id){
      const e = entities[id];
      e.cur.x = lerp(e.cur.x, e.target.x, 0.075);
      e.cur.y = lerp(e.cur.y, e.target.y, 0.075);
      e.cur.r = lerp(e.cur.r, e.target.r, 0.075);
      e.hoverBoost = lerp(e.hoverBoost, e.hovered ? 1 : 0, 0.12);
      if (!e.hovered){
        e.hoverOffset.x = lerp(e.hoverOffset.x, 0, 0.15);
        e.hoverOffset.y = lerp(e.hoverOffset.y, 0, 0.15);
      }
      if (e.variant.dynamicTopology){
        updateDynamicTopology(e, now);
      }
      if (e.taskState === "working" && now > e.workUntil){
        e.taskState = "returning";
        spawnStream(id, "s5", "return");
      }
    });
    updateS5Brain(entities.s5, now);
  }

  function frame(){
    updateThemeMix();
    updateEntities();
    computeLayout();

    mainCtx.clearRect(0,0,mainCanvas.clientWidth, mainCanvas.clientHeight);
    drawSystemPulses(mainCtx);

    // faint "command space" boundary around whichever entity is the giant
    // center sphere right now — a quiet cue that this is deliberately
    // protected negative space, not a diagram
    const centerEntity = entities[activeMain];
    mainCtx.beginPath();
    mainCtx.arc(centerEntity.cur.x, centerEntity.cur.y, centerEntity.cur.r*1.55, 0, Math.PI*2);
    mainCtx.strokeStyle = rgba(PALETTE.c3, 0.035);
    mainCtx.lineWidth = 1;
    mainCtx.stroke();

    const drawOrder = MODEL_ORDER.filter(function(id){ return id!==activeMain; }).concat([activeMain]);
    drawOrder.forEach(function(id){
      const e = entities[id];
      const cx = e.cur.x + e.hoverOffset.x;
      const cy = e.cur.y + e.hoverOffset.y;
      drawSphereVisual(mainCtx, cx, cy, e.cur.r, e, { hoverBoost:e.hoverBoost });
    });

    drawStreams(mainCtx);
    syncOverlay();
    syncHeaderAndStatus();
    statusTextEl.textContent = statusWordFor(centerEntity);
    renderWorkPanel();
    renderHistoryPanel();

    // the bottom-left mini brain always mirrors S5/LANUX itself — it is
    // LANUX's persistent presence, not whichever model happens to be focused
    const mmw = miniCanvas.clientWidth, mmh = miniCanvas.clientHeight;
    miniCtx.clearRect(0,0,mmw,mmh);
    drawSphereVisual(miniCtx, mmw/2, mmh/2, Math.min(mmw,mmh)*0.30, entities.s5, { particleScale:0.55, lineScale:0.5, phaseOffset:1.7 });

    requestAnimationFrame(frame);
  }

  /* =================================================================
     CONTROLS
  ================================================================= */
  function setVoiceMode(mode){
    entities[activeMain].mode = mode;
    if (activeMain !== "s5") entities.s5.mode = mode; // LANUX/S5 always reflects voice activity too
    document.querySelectorAll(".state-btn").forEach(function(b){
      b.classList.toggle("is-active", b.dataset.mode === mode);
    });
  }

  document.querySelectorAll(".state-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ setVoiceMode(btn.dataset.mode); });
  });
  document.querySelectorAll(".word-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      const word = btn.dataset.word;
      if (word === "warning"){
        triggerWarning(activeMain);
        logMessage(entities[activeMain].name.toUpperCase(), "Warning acknowledged — reviewing.");
      } else {
        triggerWordOn(entities[activeMain], word);
      }
    });
  });
  document.querySelectorAll(".deleg-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      const target = btn.dataset.deleg;
      if (target === "all") delegate(["scout","forge","architect","artisan","sentinel","vector","pilot","memory","watcher","hackathon"]);
      else delegate([target]);
    });
  });
  document.querySelector('.state-btn[data-mode="idle"]').classList.add("is-active");

  /* =================================================================
     FULL DEMONSTRATION SCENARIO
     A scripted end-to-end workflow: speak -> S5 decides -> delegates to
     four specialists -> they work -> a peer (watcher<->forge) exchange
     happens mid-flight -> each specialist returns results to S5 -> S5
     acknowledges. Purely a choreographed visual sequence.
  ================================================================= */
  let demoRunning = false;
  function runDemoScenario(){
    if (demoRunning) return;
    demoRunning = true;
    const demoBtn = document.getElementById("demoBtn");
    demoBtn.disabled = true;
    demoBtn.style.opacity = "0.35";

    logMessage("USER", "Set up authentication for the new service.");
    setVoiceMode("speak");

    setTimeout(function(){
      logMessage("LANUX-S5", "Breaking this into implementation, research, verification and architecture.");
      delegate(
        ["forge","scout","watcher","architect"],
        {
          forge:"Implement authentication flow",
          scout:"Research OAuth requirements",
          watcher:"Verify authentication flow",
          architect:"Design service architecture"
        },
        15000 // generous work window so the scripted beats below control pacing
      );
    }, 900);

    setTimeout(function(){ forceComplete("scout", "OAuth research complete."); }, 5300);
    setTimeout(function(){ forceComplete("architect", "Architecture design prepared."); }, 6000);
    setTimeout(function(){ forceComplete("forge", "Implementation complete."); }, 6600);

    setTimeout(function(){
      logMessage("WATCHER → FORGE", "Found an issue in the session handling.");
      spawnStream("watcher", "forge", "peer");
    }, 7900);
    setTimeout(function(){
      logMessage("FORGE → WATCHER", "Fix applied.");
      spawnStream("forge", "watcher", "peer");
    }, 8500);

    setTimeout(function(){ forceComplete("watcher", "Validation complete."); }, 9400);

    setTimeout(function(){
      logMessage("LANUX-S5", "All results received. Authentication task complete.");
      setVoiceMode("idle");
      demoRunning = false;
      demoBtn.disabled = false;
      demoBtn.style.opacity = "";
    }, 11200);
  }
  document.getElementById("demoBtn").addEventListener("click", runDemoScenario);

  /* =================================================================
     SOUND TOGGLE
  ================================================================= */
  const soundBtn = document.getElementById("soundBtn");
  function syncSoundBtn(){
    const on = AudioEngine.isEnabled();
    soundBtn.textContent = on ? "♪ SOUND: ON" : "♪ SOUND: OFF";
    soundBtn.classList.toggle("is-on", on);
  }
  soundBtn.addEventListener("click", function(){
    const next = !AudioEngine.isEnabled();
    AudioEngine.setEnabled(next); // called inside this click handler so the
                                   // AudioContext creation/resume counts as
                                   // a genuine user gesture for autoplay policy
    syncSoundBtn();
    if (next) AudioEngine.pulse({freq:520, dur:0.07, type:"sine", vol:0.4});
  });
  syncSoundBtn();

  /* =================================================================
     THEME (dark/light)
  ================================================================= */
  const themeToggleEl = document.getElementById("themeToggle");
  const docEl = document.documentElement;
  const THEME_KEY = "lanuxTheme";

  function getStoredTheme(){
    try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; }
  }
  function storeTheme(name){
    try { localStorage.setItem(THEME_KEY, name); } catch(e){ /* storage unavailable — theme still applies for this session */ }
  }

  let prefersReducedMotion = false;
  try {
    const rmQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    prefersReducedMotion = rmQuery.matches;
    // Safari <14 lacks addEventListener on MediaQueryList; addListener is
    // the deprecated-but-still-supported fallback, both guarded.
    const onRmChange = function(e){ prefersReducedMotion = e.matches; };
    if (rmQuery.addEventListener) rmQuery.addEventListener("change", onRmChange);
    else if (rmQuery.addListener) rmQuery.addListener(onRmChange);
  } catch(e){ /* matchMedia unavailable — default to full motion */ }

  // Dark is the default whenever there is no saved preference — the
  // colour reference names it "the primary, default experience", and a
  // returning visitor's own choice always wins over that default.
  function applyTheme(name, opts){
    const isLight = name === "light";
    docEl.setAttribute("data-theme", isLight ? "light" : "dark");

    themeToggleEl.setAttribute("aria-checked", isLight ? "true" : "false");
    themeToggleEl.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme");

    themeMixTarget = isLight ? 1 : 0;
    if (prefersReducedMotion){
      // honour the OS preference: the sphere palette snaps instead of
      // cross-fading over time, matching the instant CSS swap above
      themeMix = themeMixTarget;
      themeMixSettled = true;
    } else {
      themeMixSettled = false; // resume the per-frame cross-fade toward the new target
    }

    if (!opts || !opts.silent) storeTheme(isLight ? "light" : "dark");
  }

  themeToggleEl.addEventListener("click", function(){
    const isLight = docEl.getAttribute("data-theme") === "light";
    applyTheme(isLight ? "dark" : "light");
    if (AudioEngine.isEnabled()) AudioEngine.pulse({freq:isLight?460:600, dur:0.05, type:"sine", vol:0.22});
  });

  // Initial load: saved preference, else the dark default. Applied with
  // {silent:true} so restoring the user's own stored choice never
  // rewrites localStorage, and with themeMix set immediately (not eased)
  // so the very first frame renders in the correct theme, not mid-fade.
  (function initTheme(){
    const stored = getStoredTheme();
    const theme = stored === "light" ? "light" : "dark";
    applyTheme(theme, {silent:true});
    themeMix = themeMixTarget;
    themeMixSettled = true;
  })();

  /* =================================================================
     SIDEBAR TOGGLE (top-right)
  ================================================================= */
  sidebarToggleEl.addEventListener("click", function(){
    setSidebarOpen(!sidebarOpen);
  });

  /* =================================================================
     INIT
  ================================================================= */
  resize();
  setSidebarOpen(true);
  updateTopLabel();
  renderWorkPanel();
  renderHistoryPanel();
  logMessage("LANUX-S5", "Standing by. Ready for instructions.");
  requestAnimationFrame(frame);


})();
</script>
</body>
</html>
